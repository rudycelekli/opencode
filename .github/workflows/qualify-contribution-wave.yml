name: qualify-directory-review-56516
on:
  workflow_dispatch:
    inputs:
      patch_base64:
        required: true
        type: string
      patch_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'rudycelekli/opencode'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_ACTIONS: 'false'
      NO_COLOR: '1'
    steps:
      - name: Preserve LF before checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rudycelekli/opencode
          ref: 088ebed933b5fcedda767ce2e75bd077caa58c3a
          persist-credentials: false
      - name: Guard exact reviewed patch and paths
        env:
          PATCH_BASE64: ${{ inputs.patch_base64 }}
          PATCH_SHA256: ${{ inputs.patch_sha256 }}
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git reset --hard HEAD
          mkdir -p "$RUNNER_TEMP/proof"
          test "$(git rev-parse HEAD)" = 088ebed933b5fcedda767ce2e75bd077caa58c3a
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess
          data = base64.b64decode(os.environ['PATCH_BASE64'], validate=True)
          expected = 'e11259e45449888e547b4963c0369f6a08ade9e2b42b7677ce327163c342b90a'
          assert os.environ['PATCH_SHA256'] == expected
          assert hashlib.sha256(data).hexdigest() == expected
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          patch = root / 'candidate.patch'
          patch.write_bytes(data)
          allowed = {'packages/tui/src/component/prompt/autocomplete.tsx', 'packages/tui/test/app-lifecycle.test.tsx'}
          rows = subprocess.check_output(['git', 'apply', '--numstat', str(patch)], text=True).splitlines()
          assert len(rows) == 2 and {r.split('\t')[2] for r in rows} == allowed
          source_before = {}
          for name in sorted(allowed):
              exact = subprocess.check_output(['git','cat-file','blob','HEAD:'+name])
              pathlib.Path(name).write_bytes(exact)
              source_before[name] = hashlib.sha256(exact).hexdigest()
          (root/'proof/base-source-sha256.json').write_text(__import__('json').dumps(source_before,indent=2))
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          blocks = data.decode().split('diff --git ')[1:]
          tests = [b for b in blocks if any(b.startswith('a/'+name+' b/'+name+'\n') for name in ['packages/tui/test/app-lifecycle.test.tsx'])]
          assert len(tests) == 1
          (root / 'tests.patch').write_bytes(''.join('diff --git '+b for b in tests).encode())
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          (root / 'proof/patch.sha256').write_text(expected + '\n')
          PY
      - name: Setup upstream pinned Bun and dependencies
        uses: ./.github/actions/setup-bun
      - name: Capture exact toolchain
        run: |
          set -euo pipefail
          test "$(bun --version)" = "1.4.2"
          test "$(node -p "require('./package.json').packageManager.split('@')[1]")" = "1.4.2"
          git rev-parse HEAD > "$RUNNER_TEMP/proof/base.txt"
          bun --version > "$RUNNER_TEMP/proof/bun-version.txt"
          git config --global user.email 'bot@opencode.ai'
          git config --global user.name 'opencode'
      - name: Actual published directory completion baseline
        id: baseline_semantic
        env:
          EXPECT_WINDOWS: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/tests.patch"
          bun test --help > "$RUNNER_TEMP/proof/bun-test-help.txt"
          grep -- '--reporter-outfile=' "$RUNNER_TEMP/proof/bun-test-help.txt"
          set +e
          (cd packages/tui && bun test --timeout 30000 test/app-lifecycle.test.tsx -t '[/]cd Tab completion preserves the directory delimiter' --reporter=junit --reporter-outfile="$RUNNER_TEMP/proof/baseline.junit.xml") > "$RUNNER_TEMP/proof/baseline.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/proof/baseline.log"
          export BASELINE_EXIT="$result"
          python3 - <<'PYVALIDATOR'
          import re, collections
          import xml.etree.ElementTree as ET
          
          def validate(text, report, windows=False, exit_code=0):
              text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text)
              root = ET.fromstring(report)
              cases = list(root.iter("testcase"))
              selected = [c for c in cases if c.find("skipped") is None]
              filtered = [c for c in cases if c.find("skipped") is not None]
              assert not list(root.iter("error"))
              expected_filtered = [('Ctrl-O is immediate, dismissible, and prunes cached deletions at width %s', '', 'test/app-lifecycle.test.tsx'), ('Ctrl-O is immediate, dismissible, and prunes cached deletions at width %s', '', 'test/app-lifecycle.test.tsx'), ('Ctrl-O retains committed movement of a cached-only session while dismissed', '', 'test/app-lifecycle.test.tsx'), ('Ctrl-O retains committed movement of a cached-only session while refreshing', '', 'test/app-lifecycle.test.tsx'), ('SIGHUP clears title and disposes scoped resources once', '', 'test/app-lifecycle.test.tsx'), ('session lifecycle updates the terminal title and prints the epilogue after cleanup', '', 'test/app-lifecycle.test.tsx'), ('session title generated while an untitled session is loading remains visible', '', 'test/app-lifecycle.test.tsx'), ('vertical session tabs switch to horizontal below readable content width', '', 'test/app-lifecycle.test.tsx'), ('narrow vertical session tabs collapse to a compact rail with the terminal', '', 'test/app-lifecycle.test.tsx'), ('automatic rename refreshes the displayed title before settling, even without a renamed event', '', 'test/app-lifecycle.test.tsx'), ('completes custom Markdown and ordinary fences in a session at width %s', '', 'test/app-lifecycle.test.tsx'), ('completes custom Markdown and ordinary fences in a session at width %s', '', 'test/app-lifecycle.test.tsx'), ('keeps assistant footer metrics current after prepend, same-length refresh, and revert', '', 'test/app-lifecycle.test.tsx'), ('session startup prompt is submitted exactly once', '', 'test/app-lifecycle.test.tsx'), ('home startup prompt is submitted exactly once', '', 'test/app-lifecycle.test.tsx'), ('uses the resolved launch directory for new prompts (fallback: %s)', '', 'test/app-lifecycle.test.tsx'), ('uses the resolved launch directory for new prompts (fallback: %s)', '', 'test/app-lifecycle.test.tsx'), ('error investigations repeatedly seed editable home drafts without creating sessions', '', 'test/app-lifecycle.test.tsx'), ('completed user shell output replaces a partial live read when the final read fails', '', 'test/app-lifecycle.test.tsx'), ('new session inherits the active session model', '', 'test/app-lifecycle.test.tsx'), ('keeps the prompt display stable while a new location catalog loads', '', 'test/app-lifecycle.test.tsx'), ('configured app binding opens settings', '', 'test/app-lifecycle.test.tsx'), ('ctrl+c dismisses autocomplete and shell mode before exiting', '', 'test/app-lifecycle.test.tsx'), ('selection copy and pane management respect manual mode in the prompt and terminal pane', '', 'test/app-lifecycle.test.tsx'), ('selection copy and pane management respect select mode in the prompt and terminal pane', '', 'test/app-lifecycle.test.tsx'), ('execution failure keeps the empty session composer and draft usable at width %s', '', 'test/app-lifecycle.test.tsx'), ('execution failure keeps the empty session composer and draft usable at width %s', '', 'test/app-lifecycle.test.tsx'), ('server plugin failures are visible at width %s (already failed: %s)', '', 'test/app-lifecycle.test.tsx'), ('server plugin failures are visible at width %s (already failed: %s)', '', 'test/app-lifecycle.test.tsx'), ('server plugin failures are visible at width %s (already failed: %s)', '', 'test/app-lifecycle.test.tsx'), ('server plugin failures are visible at width %s (already failed: %s)', '', 'test/app-lifecycle.test.tsx'), ('server plugin failures share one notice and use source names before an ID is known', '', 'test/app-lifecycle.test.tsx'), ('retry countdown updates and clears with the retry lifecycle at width %s', '', 'test/app-lifecycle.test.tsx'), ('retry countdown updates and clears with the retry lifecycle at width %s', '', 'test/app-lifecycle.test.tsx')]
              actual_filtered = collections.Counter((c.get("name"), c.get("classname"), c.get("file", "").replace(chr(92), "/")) for c in filtered)
              assert actual_filtered == collections.Counter(tuple(x) for x in expected_filtered)
              assert all(not list(c.iter("failure")) and not list(c.iter("error")) for c in filtered)
              assert all(x.lower() not in text.lower() for x in ["Cannot find module", "Cannot find package", "Test timed out", "Unhandled error between tests", "error TS", "SyntaxError"])
              prefix = "/cd Tab completion preserves the directory delimiter for "
              expected = {prefix+x for x in ["nested", "~", ".."]} if windows else {'/cd Tab completion preserves the directory delimiter for literal\\', '/cd Tab completion preserves the directory delimiter for nested', '/cd Tab completion preserves the directory delimiter for ..', '/cd Tab completion preserves the directory delimiter for ~'}

              assert len(selected) == len(expected) and {c.get("name") for c in selected} == expected
              assert all(c.get("file", "").replace(chr(92), "/") == "test/app-lifecycle.test.tsx" and c.get("classname") == "" for c in selected)
              failed = {c.get("name") for c in selected if c.find("failure") is not None}
              assert failed == ({prefix+"~",prefix+".."} if windows else set())
              assert exit_code == (1 if windows else 0)
              assert re.findall(r"^\s*(\d+) pass\s*$",text,re.M) == ["1" if windows else "4"]
              assert re.findall(r"^\s*(\d+) fail\s*$",text,re.M) == ["2" if windows else "0"]
              assert root.get("tests") == ("37" if windows else "38") and root.get("skipped") == "34"
              assert root.get("failures") == ("2" if windows else "0")
              if windows:
                  for case in selected:
                      failure = case.find("failure")
                      if failure is None: continue
                      detail = "".join(failure.itertext()) + failure.get("message", "")
                      assert "toBe" in detail and "/cd " in detail
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'proof'
          validate((root/'baseline.log').read_text(), (root/'baseline.junit.xml').read_text(), os.environ.get('EXPECT_WINDOWS') == '1', int(os.environ.get('BASELINE_EXIT', '0')))
          PYVALIDATOR
          git restore -- packages/tui/test/app-lifecycle.test.tsx
          git diff --exit-code
      - name: Apply candidate and verify initial full-index identity
        id: candidate_apply
        if: always() && steps.baseline_semantic.outcome == 'success'
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/candidate.patch"
          git diff --check
          git diff --binary --full-index > "$RUNNER_TEMP/proof/initial-full-index.patch"
          cmp "$RUNNER_TEMP/candidate.patch" "$RUNNER_TEMP/proof/initial-full-index.patch"
          test -z "$(git ls-files --others --exclude-standard)"
          sha256sum packages/tui/src/component/prompt/autocomplete.tsx packages/tui/test/app-lifecycle.test.tsx > "$RUNNER_TEMP/proof/source-sha256.txt"
      - name: Focused actual directory completion repeated
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          (cd packages/tui && bun test --timeout 30000 test/app-lifecycle.test.tsx -t '[/]cd Tab completion preserves the directory delimiter' --rerun-each 10) 2>&1 | tee "$RUNNER_TEMP/proof/focused.log"
      - name: Full TUI tests
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          (cd packages/tui && bun run test) 2>&1 | tee "$RUNNER_TEMP/proof/tui-tests.log"
      - name: TUI typecheck
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          (cd packages/tui && bun typecheck) 2>&1 | tee "$RUNNER_TEMP/proof/tui-typecheck.log"
      - name: Canonical repository check
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          bun run check 2>&1 | tee "$RUNNER_TEMP/proof/check.log"
      - name: Verify final deterministic full-index source identity
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          git diff --binary --full-index > "$RUNNER_TEMP/proof/final-full-index.patch"
          git status --porcelain=v1 > "$RUNNER_TEMP/proof/final-status.txt"
          sha256sum packages/tui/src/component/prompt/autocomplete.tsx packages/tui/test/app-lifecycle.test.tsx > "$RUNNER_TEMP/proof/final-source-sha256.txt"
          sha256sum -c "$RUNNER_TEMP/proof/source-sha256.txt"
          git diff --check
          test -z "$(git ls-files --others --exclude-standard)"
          cmp "$RUNNER_TEMP/proof/initial-full-index.patch" "$RUNNER_TEMP/proof/final-full-index.patch"
          cmp "$RUNNER_TEMP/candidate.patch" "$RUNNER_TEMP/proof/final-full-index.patch"
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: directory-review-56516-native-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/proof
          if-no-files-found: error
