{
  "name": "qualify-review-56519",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "patch_base64": {
          "required": true,
          "type": "string"
        },
        "patch_sha256": {
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "qualify-review-56519",
    "cancel-in-progress": false
  },
  "jobs": {
    "native": {
      "if": "github.repository == 'rudycelekli/opencode'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "env": {
        "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24": "true",
        "GITHUB_ACTIONS": "false",
        "NO_COLOR": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "repository": "rudycelekli/opencode",
            "ref": "78c1f9072b627d3007bfdb38bab3f956231886db",
            "persist-credentials": false
          }
        },
        {
          "name": "Guard exact reviewed base patch and test-only paths",
          "env": {
            "PATCH_BASE64": "${{ inputs.patch_base64 }}",
            "PATCH_SHA256": "${{ inputs.patch_sha256 }}"
          },
          "run": "python3 - <<'PY'\nimport base64,hashlib,os,pathlib,subprocess\nroot=pathlib.Path(os.environ['RUNNER_TEMP']); (root/'proof').mkdir(exist_ok=True)\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='78c1f9072b627d3007bfdb38bab3f956231886db'\nassert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()\ndata=base64.b64decode(os.environ['PATCH_BASE64'],validate=True)\nassert os.environ['PATCH_SHA256']==hashlib.sha256(data).hexdigest()=='2b1257e83c6367c4a4ecdebb0b3a59a6c737d58a473df49063b5965f7ec22a1c'\npatch=root/'candidate.patch';patch.write_bytes(data)\nrows=subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()\nassert len(rows)==2 and {r.split('\\t')[2] for r in rows}=={'packages/core/test/session-runner-message.test.ts', 'packages/core/test/session-prompt.test.ts'}\nassert all(all(x.isdigit() for x in r.split('\\t')[:2]) for r in rows)\nsubprocess.run(['git','apply','--check',str(patch)],check=True)\n(root/'proof/patch.sha256').write_text('2b1257e83c6367c4a4ecdebb0b3a59a6c737d58a473df49063b5965f7ec22a1c'+'\\n')\nPY\n"
        },
        {
          "name": "Setup pinned Bun and locked dependencies",
          "uses": "./.github/actions/setup-bun"
        },
        {
          "name": "Verify native toolchain",
          "run": "set -euo pipefail\ntest \"$(bun --version)\" = 1.4.2\ntest \"$(node -p \"require('./package.json').packageManager\")\" = bun@1.4.2\nbun --version > \"$RUNNER_TEMP/proof/bun-version.txt\"\ngit rev-parse HEAD > \"$RUNNER_TEMP/proof/base.txt\"\ngit config --global user.email bot@opencode.ai\ngit config --global user.name opencode\n"
        },
        {
          "name": "Prepare verified native ripgrep for full Core suite",
          "run": "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/native-tools\"\ncurl --fail --location --max-time 120 https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz --output \"$RUNNER_TEMP/ripgrep.tar.gz\"\necho \"1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599  $RUNNER_TEMP/ripgrep.tar.gz\" | sha256sum --check\ntar -xzf \"$RUNNER_TEMP/ripgrep.tar.gz\" --strip-components=1 -C \"$RUNNER_TEMP/native-tools\" ripgrep-15.1.0-x86_64-unknown-linux-musl/rg\n\"$RUNNER_TEMP/native-tools/rg\" --version | tee \"$RUNNER_TEMP/proof/ripgrep-version.txt\"\necho \"$RUNNER_TEMP/native-tools\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "Original published focused tests (not a product failure oracle)",
          "run": "set -euo pipefail\n(cd packages/core && bun run script/test.ts test/session-runner-message.test.ts test/session-prompt.test.ts) 2>&1 | tee \"$RUNNER_TEMP/proof/original-focused.log\"\n"
        },
        {
          "name": "Apply test-only refinement and verify exact source identity",
          "id": "candidate_apply",
          "run": "set -euo pipefail\ngit diff --exit-code\ngit apply \"$RUNNER_TEMP/candidate.patch\"\ngit diff --check\ngit diff --binary --full-index > \"$RUNNER_TEMP/proof/initial-full-index.patch\"\ncmp \"$RUNNER_TEMP/candidate.patch\" \"$RUNNER_TEMP/proof/initial-full-index.patch\"\necho 'afade04f7a6df10b3c9e27495d05f2a17dd6d26793936cd602bc2139933955d7  packages/core/test/session-prompt.test.ts' | sha256sum --check\necho '951dbf26a02f9903fae8cc1820d1b3e9cbea9dbbc657a27dc3cea98cda6d5357  packages/core/test/session-runner-message.test.ts' | sha256sum --check\nsha256sum packages/core/test/session-prompt.test.ts packages/core/test/session-runner-message.test.ts > \"$RUNNER_TEMP/proof/source-sha256.txt\"\ntest -z \"$(git ls-files --others --exclude-standard)\"\n"
        },
        {
          "name": "Focused remaining contract tests repeated ten times",
          "run": "set -euo pipefail\n(cd packages/core && bun run script/test.ts test/session-runner-message.test.ts test/session-prompt.test.ts --rerun-each 10) 2>&1 | tee \"$RUNNER_TEMP/proof/focused-repeat10.log\"\n",
          "if": "always() && steps.candidate_apply.outcome == 'success'"
        },
        {
          "name": "Full AI cassette replay suite",
          "run": "set -euo pipefail\n(cd packages/ai && bun run test) 2>&1 | tee \"$RUNNER_TEMP/proof/ai-tests.log\"\n",
          "if": "always() && steps.candidate_apply.outcome == 'success'"
        },
        {
          "name": "Full Core suite",
          "run": "set -euo pipefail\n(cd packages/core && bun run test) 2>&1 | tee \"$RUNNER_TEMP/proof/core-tests.log\"\n",
          "if": "always() && steps.candidate_apply.outcome == 'success'"
        },
        {
          "name": "AI typecheck",
          "run": "set -euo pipefail\n(cd packages/ai && bun typecheck) 2>&1 | tee \"$RUNNER_TEMP/proof/ai-typecheck.log\"\n",
          "if": "always() && steps.candidate_apply.outcome == 'success'"
        },
        {
          "name": "Core typecheck",
          "run": "set -euo pipefail\n(cd packages/core && bun typecheck) 2>&1 | tee \"$RUNNER_TEMP/proof/core-typecheck.log\"\n",
          "if": "always() && steps.candidate_apply.outcome == 'success'"
        },
        {
          "name": "Canonical root check",
          "run": "set -euo pipefail\nbun run check 2>&1 | tee \"$RUNNER_TEMP/proof/root-check.log\"\n",
          "if": "always() && steps.candidate_apply.outcome == 'success'"
        },
        {
          "name": "Verify final full-index and source identity",
          "run": "set -euo pipefail\ngit diff --binary --full-index > \"$RUNNER_TEMP/proof/final-full-index.patch\"\ncmp \"$RUNNER_TEMP/candidate.patch\" \"$RUNNER_TEMP/proof/final-full-index.patch\"\ncmp \"$RUNNER_TEMP/proof/initial-full-index.patch\" \"$RUNNER_TEMP/proof/final-full-index.patch\"\nsha256sum -c \"$RUNNER_TEMP/proof/source-sha256.txt\"\ngit diff --check\ntest -z \"$(git ls-files --others --exclude-standard)\"\ngit status --porcelain=v1 > \"$RUNNER_TEMP/proof/final-status.txt\"\n",
          "if": "always() && steps.candidate_apply.outcome == 'success'"
        },
        {
          "name": "Retain actual native evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "review-56519-native-evidence",
            "path": "${{ runner.temp }}/proof",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
