{
  "name": "qualify-webfetch-review-56505",
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native": {
      "if": "github.repository == 'rudycelekli/opencode'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "env": {
        "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24": true,
        "GITHUB_ACTIONS": "false",
        "NO_COLOR": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "repository": "rudycelekli/opencode",
            "ref": "fba000f64b50ed8a059c585bbdb4a6f3e3f90142",
            "persist-credentials": false
          }
        },
        {
          "name": "Guard exact reviewed patch and paths",
          "env": {
            "PATCH_BASE64": "${{ inputs.patch_base64 }}",
            "PATCH_SHA256": "${{ inputs.patch_sha256 }}"
          },
          "run": "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/proof\"\ntest \"$(git rev-parse HEAD)\" = fba000f64b50ed8a059c585bbdb4a6f3e3f90142\npython3 - <<'PY'\nimport base64, hashlib, os, pathlib, subprocess\ndata = base64.b64decode(os.environ['PATCH_BASE64'], validate=True)\nexpected = '3856d9d4ed8d4a198413fb95fb6cbd6d84ee58571444133fd1499530f69e7535'\nassert os.environ['PATCH_SHA256'] == expected\nassert hashlib.sha256(data).hexdigest() == expected\nroot = pathlib.Path(os.environ['RUNNER_TEMP'])\npatch = root / 'candidate.patch'\npatch.write_bytes(data)\nallowed = {'packages/core/test/tool-webfetch.test.ts'}\nrows = subprocess.check_output(['git', 'apply', '--numstat', str(patch)], text=True).splitlines()\nassert rows == ['0\\t38\\tpackages/core/test/tool-webfetch.test.ts']\nassert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()\nsubprocess.run(['git', 'apply', '--check', str(patch)], check=True)\n(root / 'proof/patch.sha256').write_text(expected + '\\n')\nPY\n"
        },
        {
          "name": "Setup upstream pinned Bun and dependencies",
          "uses": "./.github/actions/setup-bun"
        },
        {
          "name": "Capture exact toolchain",
          "run": "set -euo pipefail\ntest \"$(bun --version)\" = \"1.4.2\"\ntest \"$(node -p \"require('./package.json').packageManager.split('@')[1]\")\" = \"1.4.2\"\ngit rev-parse HEAD > \"$RUNNER_TEMP/proof/base.txt\"\nbun --version > \"$RUNNER_TEMP/proof/bun-version.txt\"\ngit config --global user.email 'bot@opencode.ai'\ngit config --global user.name 'opencode'\n"
        },
        {
          "name": "Prepare verified native ripgrep before test network guards",
          "run": "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/native-tools\"\ncurl --fail --location --max-time 120 https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz --output \"$RUNNER_TEMP/ripgrep.tar.gz\"\necho \"1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599  $RUNNER_TEMP/ripgrep.tar.gz\" | sha256sum --check\ntar -xzf \"$RUNNER_TEMP/ripgrep.tar.gz\" --strip-components=1 -C \"$RUNNER_TEMP/native-tools\" ripgrep-15.1.0-x86_64-unknown-linux-musl/rg\n\"$RUNNER_TEMP/native-tools/rg\" --version | tee \"$RUNNER_TEMP/proof/ripgrep-version.txt\"\necho \"$RUNNER_TEMP/native-tools\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "Published retained regression baseline (expected success)",
          "id": "baseline_semantic",
          "run": "set -euo pipefail\n(cd packages/core && bun run script/test.ts test/tool-webfetch.test.ts -t 'reports when nonempty HTML has no readable text') 2>&1 | tee \"$RUNNER_TEMP/proof/baseline.log\"\npython3 - <<'PYVALIDATOR'\nimport os, pathlib, re\ntext = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'proof/baseline.log').read_text()\ntext = re.sub(r'\\x1b\\[[0-?]*[ -/]*[@-~]', '', text)\nassert re.findall(r'^\\s*(\\d+) pass\\s*$', text, re.M) == ['1']\nassert re.findall(r'^\\s*(\\d+) fail\\s*$', text, re.M) == ['0']\npassed = re.findall(r'^\\(pass\\) (.*?) \\[[^\\n]*\\]$', text, re.M)\nassert len(passed) == 1 and passed[0].endswith('reports when nonempty HTML has no readable text')\nassert not re.findall(r'^\\(fail\\)', text, re.M)\nassert all(x.lower() not in text.lower() for x in ['Cannot find module', 'Cannot find package', 'Test timed out', 'Unhandled error between tests', 'error TS', 'SyntaxError'])\nPYVALIDATOR\ngit diff --exit-code\n"
        },
        {
          "name": "Apply candidate and verify initial full-index identity",
          "id": "candidate_apply",
          "if": "always() && steps.baseline_semantic.outcome == 'success'",
          "run": "set -euo pipefail\ngit apply \"$RUNNER_TEMP/candidate.patch\"\ngit diff --check\ngit diff --binary --full-index > \"$RUNNER_TEMP/proof/initial-full-index.patch\"\ncmp \"$RUNNER_TEMP/candidate.patch\" \"$RUNNER_TEMP/proof/initial-full-index.patch\"\ntest -z \"$(git ls-files --others --exclude-standard)\"\nsha256sum packages/core/test/tool-webfetch.test.ts > \"$RUNNER_TEMP/proof/source-sha256.txt\"\n"
        },
        {
          "name": "Focused actual WebFetch tool suite",
          "if": "always() && steps.candidate_apply.outcome == 'success'",
          "run": "set -euo pipefail\n(cd packages/core && bun run script/test.ts test/tool-webfetch.test.ts) 2>&1 | tee \"$RUNNER_TEMP/proof/focused.log\"\n"
        },
        {
          "name": "Full Core tests",
          "if": "always() && steps.candidate_apply.outcome == 'success'",
          "run": "set -euo pipefail\n(cd packages/core && bun run test) 2>&1 | tee \"$RUNNER_TEMP/proof/core-tests.log\"\n"
        },
        {
          "name": "Core typecheck",
          "if": "always() && steps.candidate_apply.outcome == 'success'",
          "run": "set -euo pipefail\n(cd packages/core && bun typecheck) 2>&1 | tee \"$RUNNER_TEMP/proof/core-typecheck.log\"\n"
        },
        {
          "name": "Canonical repository check",
          "if": "always() && steps.candidate_apply.outcome == 'success'",
          "run": "set -euo pipefail\n(bun run check) 2>&1 | tee \"$RUNNER_TEMP/proof/check.log\"\n"
        },
        {
          "name": "Verify final deterministic full-index source identity",
          "if": "always() && steps.candidate_apply.outcome == 'success'",
          "run": "set -euo pipefail\ngit diff --binary --full-index > \"$RUNNER_TEMP/proof/final-full-index.patch\"\ngit status --porcelain=v1 > \"$RUNNER_TEMP/proof/final-status.txt\"\nsha256sum packages/core/test/tool-webfetch.test.ts > \"$RUNNER_TEMP/proof/final-source-sha256.txt\"\nsha256sum -c \"$RUNNER_TEMP/proof/source-sha256.txt\"\ngit diff --check\ntest -z \"$(git ls-files --others --exclude-standard)\"\ncmp \"$RUNNER_TEMP/proof/initial-full-index.patch\" \"$RUNNER_TEMP/proof/final-full-index.patch\"\ncmp \"$RUNNER_TEMP/candidate.patch\" \"$RUNNER_TEMP/proof/final-full-index.patch\"\n"
        },
        {
          "name": "Retain native evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "webfetch-review-56505-native-evidence",
            "path": "${{ runner.temp }}/proof",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  },
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "patch_base64": {
          "required": true,
          "type": "string"
        },
        "patch_sha256": {
          "required": true,
          "type": "string"
        }
      }
    }
  }
}
