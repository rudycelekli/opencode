{
  "name": "qualify-review-56515",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "patch_base64": {
          "required": true,
          "type": "string"
        },
        "patch_sha256": {
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "qualify-review-56515",
    "cancel-in-progress": false
  },
  "jobs": {
    "native": {
      "if": "github.repository == 'rudycelekli/opencode'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "env": {
        "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24": "true",
        "GITHUB_ACTIONS": "false",
        "NO_COLOR": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "repository": "rudycelekli/opencode",
            "ref": "1fadb2fcc078a8c83ab15e26fa709d2dbbf5b2fd",
            "persist-credentials": false
          }
        },
        {
          "name": "Guard exact reviewed base patch and sole documentation path",
          "env": {
            "PATCH_BASE64": "${{ inputs.patch_base64 }}",
            "PATCH_SHA256": "${{ inputs.patch_sha256 }}"
          },
          "run": "python3 - <<'PY'\nimport base64,hashlib,os,pathlib,subprocess\nroot=pathlib.Path(os.environ['RUNNER_TEMP']); (root/'proof').mkdir(exist_ok=True)\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='1fadb2fcc078a8c83ab15e26fa709d2dbbf5b2fd'\nassert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()\ndata=base64.b64decode(os.environ['PATCH_BASE64'],validate=True)\nassert os.environ['PATCH_SHA256']==hashlib.sha256(data).hexdigest()=='9f07a62c9d0ad8f6b7a7085ee2a0271631704acc1eb88ebcd783bcd5625e29f7'\npatch=root/'candidate.patch';patch.write_bytes(data)\nrows=subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()\nassert len(rows)==1 and rows[0].split('\\t')[2]=='services/www/src/docs/content/troubleshooting.mdx'\nassert all(x.isdigit() for x in rows[0].split('\\t')[:2])\nsubprocess.run(['git','apply','--check',str(patch)],check=True)\n(root/'proof/patch.sha256').write_text('9f07a62c9d0ad8f6b7a7085ee2a0271631704acc1eb88ebcd783bcd5625e29f7'+'\\n')\nPY\n"
        },
        {
          "name": "Setup pinned Bun and locked dependencies",
          "uses": "./.github/actions/setup-bun"
        },
        {
          "name": "Verify native toolchain",
          "run": "set -euo pipefail\ntest \"$(bun --version)\" = 1.4.2\ntest \"$(node -p \"require('./package.json').packageManager\")\" = bun@1.4.2\nbun --version > \"$RUNNER_TEMP/proof/bun-version.txt\"\ngit rev-parse HEAD > \"$RUNNER_TEMP/proof/base.txt\"\ngit config --global user.email bot@opencode.ai\ngit config --global user.name opencode\n"
        },
        {
          "name": "Apply documentation repair and verify exact source identity",
          "id": "candidate_apply",
          "run": "set -euo pipefail\ngit diff --exit-code\ngit apply \"$RUNNER_TEMP/candidate.patch\"\ngit diff --check\ngit diff --binary --full-index > \"$RUNNER_TEMP/proof/initial-full-index.patch\"\ncmp \"$RUNNER_TEMP/candidate.patch\" \"$RUNNER_TEMP/proof/initial-full-index.patch\"\necho '2afe6c0e38c3259fab896a70457c28a919464e37f956a251859a2909dd22b4c9  services/www/src/docs/content/troubleshooting.mdx' | sha256sum --check\nsha256sum services/www/src/docs/content/troubleshooting.mdx > \"$RUNNER_TEMP/proof/source-sha256.txt\"\ntest -z \"$(git ls-files --others --exclude-standard)\"\n"
        },
        {
          "name": "Website typecheck",
          "if": "always() && steps.candidate_apply.outcome == 'success'",
          "run": "set -euo pipefail\n(cd services/www && bun typecheck) 2>&1 | tee \"$RUNNER_TEMP/proof/website-typecheck.log\"\n"
        },
        {
          "name": "Generated docs identity check",
          "if": "always() && steps.candidate_apply.outcome == 'success'",
          "run": "set -euo pipefail\n(cd services/www && bun run check:generated) 2>&1 | tee \"$RUNNER_TEMP/proof/website-generated.log\"\n"
        },
        {
          "name": "Website build and link validation",
          "if": "always() && steps.candidate_apply.outcome == 'success'",
          "run": "set -euo pipefail\n(cd services/www && bun run build) 2>&1 | tee \"$RUNNER_TEMP/proof/website-build.log\"\n"
        },
        {
          "name": "Canonical root check",
          "run": "set -euo pipefail\nbun run check 2>&1 | tee \"$RUNNER_TEMP/proof/root-check.log\"\n",
          "if": "always() && steps.candidate_apply.outcome == 'success'"
        },
        {
          "name": "Verify final full-index and source identity",
          "run": "set -euo pipefail\ngit diff --binary --full-index > \"$RUNNER_TEMP/proof/final-full-index.patch\"\ncmp \"$RUNNER_TEMP/candidate.patch\" \"$RUNNER_TEMP/proof/final-full-index.patch\"\ncmp \"$RUNNER_TEMP/proof/initial-full-index.patch\" \"$RUNNER_TEMP/proof/final-full-index.patch\"\nsha256sum -c \"$RUNNER_TEMP/proof/source-sha256.txt\"\ngit diff --check\ntest -z \"$(git ls-files --others --exclude-standard)\"\ngit status --porcelain=v1 > \"$RUNNER_TEMP/proof/final-status.txt\"\n",
          "if": "always() && steps.candidate_apply.outcome == 'success'"
        },
        {
          "name": "Retain actual native evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "review-56515-native-evidence",
            "path": "${{ runner.temp }}/proof",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
