{
  "name": "qualify-directory-review-56516",
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native": {
      "if": "github.repository == 'rudycelekli/opencode'",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-24.04",
            "windows-2025"
          ]
        }
      },
      "runs-on": "${{ matrix.os }}",
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "timeout-minutes": 60,
      "env": {
        "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24": true,
        "GITHUB_ACTIONS": "false",
        "NO_COLOR": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "repository": "rudycelekli/opencode",
            "ref": "088ebed933b5fcedda767ce2e75bd077caa58c3a",
            "persist-credentials": false
          }
        },
        {
          "name": "Guard exact reviewed patch and paths",
          "env": {
            "PATCH_BASE64": "${{ inputs.patch_base64 }}",
            "PATCH_SHA256": "${{ inputs.patch_sha256 }}"
          },
          "run": "set -euo pipefail\ngit config core.autocrlf false\ngit reset --hard HEAD\nmkdir -p \"$RUNNER_TEMP/proof\"\ntest \"$(git rev-parse HEAD)\" = 088ebed933b5fcedda767ce2e75bd077caa58c3a\npython3 - <<'PY'\nimport base64, hashlib, os, pathlib, subprocess\ndata = base64.b64decode(os.environ['PATCH_BASE64'], validate=True)\nexpected = 'e11259e45449888e547b4963c0369f6a08ade9e2b42b7677ce327163c342b90a'\nassert os.environ['PATCH_SHA256'] == expected\nassert hashlib.sha256(data).hexdigest() == expected\nroot = pathlib.Path(os.environ['RUNNER_TEMP'])\npatch = root / 'candidate.patch'\npatch.write_bytes(data)\nallowed = {'packages/tui/src/component/prompt/autocomplete.tsx', 'packages/tui/test/app-lifecycle.test.tsx'}\nrows = subprocess.check_output(['git', 'apply', '--numstat', str(patch)], text=True).splitlines()\nassert len(rows) == 2 and {r.split('\\t')[2] for r in rows} == allowed\nassert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()\nblocks = data.decode().split('diff --git ')[1:]\ntests = [b for b in blocks if any(b.startswith('a/'+name+' b/'+name+'\\n') for name in ['packages/tui/test/app-lifecycle.test.tsx'])]\nassert len(tests) == 1\n(root / 'tests.patch').write_text(''.join('diff --git '+b for b in tests))\nsubprocess.run(['git', 'apply', '--check', str(patch)], check=True)\n(root / 'proof/patch.sha256').write_text(expected + '\\n')\nPY\n"
        },
        {
          "name": "Setup upstream pinned Bun and dependencies",
          "uses": "./.github/actions/setup-bun"
        },
        {
          "name": "Capture exact toolchain",
          "run": "set -euo pipefail\ntest \"$(bun --version)\" = \"1.4.2\"\ntest \"$(node -p \"require('./package.json').packageManager.split('@')[1]\")\" = \"1.4.2\"\ngit rev-parse HEAD > \"$RUNNER_TEMP/proof/base.txt\"\nbun --version > \"$RUNNER_TEMP/proof/bun-version.txt\"\ngit config --global user.email 'bot@opencode.ai'\ngit config --global user.name 'opencode'\n"
        },
        {
          "name": "Actual published directory completion baseline",
          "id": "baseline_semantic",
          "env": {
            "EXPECT_WINDOWS": "${{ runner.os == 'Windows' && '1' || '0' }}"
          },
          "run": "set -euo pipefail\ngit apply \"$RUNNER_TEMP/tests.patch\"\nbun test --help > \"$RUNNER_TEMP/proof/bun-test-help.txt\"\ngrep -- '--reporter-outfile=' \"$RUNNER_TEMP/proof/bun-test-help.txt\"\nset +e\n(cd packages/tui && bun test --timeout 30000 test/app-lifecycle.test.tsx -t '/cd Tab completion preserves the directory delimiter' --reporter=junit --reporter-outfile=\"$RUNNER_TEMP/proof/baseline.junit.xml\") > \"$RUNNER_TEMP/proof/baseline.log\" 2>&1\nresult=$?\nset -e\ncat \"$RUNNER_TEMP/proof/baseline.log\"\nexport BASELINE_EXIT=\"$result\"\npython3 - <<'PYVALIDATOR'\nimport os, pathlib, re, xml.etree.ElementTree as ET\nroot = pathlib.Path(os.environ['RUNNER_TEMP']) / 'proof'\ntext = (root/'baseline.log').read_text()\nreport = ET.parse(root/'baseline.junit.xml').getroot()\ncases = list(report.iter('testcase'))\nprefix = '/cd Tab completion preserves the directory delimiter for '\nwindows = os.environ['EXPECT_WINDOWS'] == '1'\nexpected = {prefix+x for x in (['nested','~','..'] if windows else ['nested','~','..','literal\\\\'])}\nassert len(cases) == len(expected) and {c.get('name') for c in cases} == expected\nfailed = {c.get('name') for c in cases if c.find('failure') is not None}\nassert failed == ({prefix+'~',prefix+'..'} if windows else set())\nassert not list(report.iter('error')) and not list(report.iter('skipped'))\nassert os.environ['BASELINE_EXIT'] == ('1' if windows else '0')\nassert re.findall(r'^\\s*(\\d+) pass\\s*$',text,re.M) == [('1' if windows else '4')]\nassert re.findall(r'^\\s*(\\d+) fail\\s*$',text,re.M) == [('2' if windows else '0')]\nif windows:\n    for case in cases:\n        failure = case.find('failure')\n        if failure is None: continue\n        detail = ''.join(failure.itertext()) + failure.get('message','')\n        assert 'toBe' in detail and '/cd ' in detail, detail\nassert all(x.lower() not in text.lower() for x in ['Cannot find module','Cannot find package','Test timed out','Unhandled error between tests','SyntaxError','error TS'])\nPYVALIDATOR\ngit restore -- packages/tui/test/app-lifecycle.test.tsx\ngit diff --exit-code\n"
        },
        {
          "name": "Apply candidate and verify initial full-index identity",
          "id": "candidate_apply",
          "if": "always() && steps.baseline_semantic.outcome == 'success'",
          "run": "set -euo pipefail\ngit apply \"$RUNNER_TEMP/candidate.patch\"\ngit diff --check\ngit diff --binary --full-index > \"$RUNNER_TEMP/proof/initial-full-index.patch\"\ncmp \"$RUNNER_TEMP/candidate.patch\" \"$RUNNER_TEMP/proof/initial-full-index.patch\"\ntest -z \"$(git ls-files --others --exclude-standard)\"\nsha256sum packages/tui/src/component/prompt/autocomplete.tsx packages/tui/test/app-lifecycle.test.tsx > \"$RUNNER_TEMP/proof/source-sha256.txt\"\n"
        },
        {
          "name": "Focused actual directory completion repeated",
          "if": "always() && steps.candidate_apply.outcome == 'success'",
          "run": "set -euo pipefail\n(cd packages/tui && bun test --timeout 30000 test/app-lifecycle.test.tsx -t '/cd Tab completion preserves the directory delimiter' --rerun-each 10) 2>&1 | tee \"$RUNNER_TEMP/proof/focused.log\"\n"
        },
        {
          "name": "Full TUI tests",
          "if": "always() && steps.candidate_apply.outcome == 'success'",
          "run": "set -euo pipefail\n(cd packages/tui && bun run test) 2>&1 | tee \"$RUNNER_TEMP/proof/tui-tests.log\"\n"
        },
        {
          "name": "TUI typecheck",
          "if": "always() && steps.candidate_apply.outcome == 'success'",
          "run": "set -euo pipefail\n(cd packages/tui && bun typecheck) 2>&1 | tee \"$RUNNER_TEMP/proof/tui-typecheck.log\"\n"
        },
        {
          "name": "Canonical repository check",
          "if": "always() && steps.candidate_apply.outcome == 'success'",
          "run": "set -euo pipefail\nbun run check 2>&1 | tee \"$RUNNER_TEMP/proof/check.log\"\n"
        },
        {
          "name": "Verify final deterministic full-index source identity",
          "if": "always() && steps.candidate_apply.outcome == 'success'",
          "run": "set -euo pipefail\ngit diff --binary --full-index > \"$RUNNER_TEMP/proof/final-full-index.patch\"\ngit status --porcelain=v1 > \"$RUNNER_TEMP/proof/final-status.txt\"\nsha256sum packages/tui/src/component/prompt/autocomplete.tsx packages/tui/test/app-lifecycle.test.tsx > \"$RUNNER_TEMP/proof/final-source-sha256.txt\"\nsha256sum -c \"$RUNNER_TEMP/proof/source-sha256.txt\"\ngit diff --check\ntest -z \"$(git ls-files --others --exclude-standard)\"\ncmp \"$RUNNER_TEMP/proof/initial-full-index.patch\" \"$RUNNER_TEMP/proof/final-full-index.patch\"\ncmp \"$RUNNER_TEMP/candidate.patch\" \"$RUNNER_TEMP/proof/final-full-index.patch\"\n"
        },
        {
          "name": "Retain native evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "directory-review-56516-native-evidence-${{ matrix.os }}",
            "path": "${{ runner.temp }}/proof",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  },
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "patch_base64": {
          "required": true,
          "type": "string"
        },
        "patch_sha256": {
          "required": true,
          "type": "string"
        }
      }
    }
  }
}