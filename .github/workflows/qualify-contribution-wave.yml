{
  "name": "qualify-contribution-wave",
  "run-name": "Qualify ${{ inputs.case }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "case": {
          "required": true,
          "type": "choice",
          "options": [
            "webfetch-empty",
            "command-variant",
            "directory-separator",
            "local-provider-docs",
            "skill-xml",
            "finish-diagnostic",
            "config-xdg",
            "compaction-ceiling",
            "malformed-glob",
            "kimi-provider-icon",
            "minimax-effort",
            "opener-errors",
            "mcp-prompt-errors",
            "attachment-fallback",
            "otlp-docs",
            "formatter-timeout",
            "subagent-depth",
            "generic-summary"
          ]
        },
        "patch_base64": {
          "required": true,
          "type": "string"
        },
        "patch_sha256": {
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native": {
      "if": "github.repository == 'rudycelekli/opencode'",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": "${{ fromJSON(inputs.case == 'directory-separator' && '[\"ubuntu-24.04\",\"windows-2022\"]' || '[\"ubuntu-24.04\"]') }}"
        }
      },
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 45,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "env": {
        "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24": "true",
        "NO_COLOR": "1",
        "GITHUB_ACTIONS": "false",
        "CASE": "${{ inputs.case }}"
      },
      "steps": [
        {
          "name": "Use unchanged LF source",
          "run": "git config --global core.autocrlf false"
        },
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "repository": "anomalyco/opencode",
            "ref": "8c173a8f3805d8e749d44311054b07e37a1b2ce1",
            "persist-credentials": false
          }
        },
        {
          "name": "Guard source patch and case allowlist",
          "env": {
            "PATCH_BASE64": "${{ inputs.patch_base64 }}",
            "PATCH_SHA256": "${{ inputs.patch_sha256 }}"
          },
          "run": "python - <<'PY'\nimport base64,hashlib,json,os,pathlib,subprocess\nroot=pathlib.Path.cwd(); proof=pathlib.Path(os.environ['RUNNER_TEMP'])/'contribution-proof';proof.mkdir()\nrecipes={'webfetch-empty': {'package': 'packages/core', 'files': ['packages/core/src/tool/plugin/webfetch.ts', 'packages/core/test/tool-webfetch.test.ts'], 'tests': ['packages/core/test/tool-webfetch.test.ts'], 'focus': ['bun', 'run', 'script/test.ts', 'test/tool-webfetch.test.ts', '-t', 'reports when nonempty HTML has no readable text'], 'suite': ['bun', 'run', 'script/test.ts', 'test/tool-webfetch.test.ts'], 'marker': 'reports when nonempty HTML has no readable text', 'failures': 1}, 'command-variant': {'package': 'packages/core', 'files': ['packages/core/src/config/plugin/command.ts', 'packages/core/test/config/command-subagent.test.ts'], 'tests': ['packages/core/test/config/command-subagent.test.ts'], 'focus': ['bun', 'run', 'script/test.ts', 'test/config/command-subagent.test.ts', '-t', 'command reasoning variants'], 'suite': ['bun', 'run', 'script/test.ts', 'test/config/command.test.ts', 'test/config/command-subagent.test.ts'], 'marker': 'command reasoning variants', 'failures': 3}, 'directory-separator': {'package': 'packages/tui', 'files': ['packages/tui/src/component/prompt/autocomplete.tsx', 'packages/tui/test/app-lifecycle.test.tsx'], 'tests': ['packages/tui/test/app-lifecycle.test.tsx'], 'focus': ['bun', 'test', '--timeout', '30000', 'test/app-lifecycle.test.tsx', '-t', '/cd Tab completion'], 'suite': ['bun', 'test', '--timeout', '30000', 'test/prompt/autocomplete.test.ts', 'test/app-lifecycle.test.tsx'], 'marker': '/cd Tab completion', 'failures': 1}, 'local-provider-docs': {'package': 'services/www', 'files': ['services/www/src/docs/content/models.mdx', 'services/www/src/docs/content/providers.mdx', 'services/www/src/docs/content/console/providers.mdx'], 'tests': []}, 'skill-xml': {'package': 'packages/core', 'files': ['packages/core/src/skill.ts', 'packages/core/src/skill/instructions.ts', 'packages/core/src/util/xml.ts', 'packages/core/test/tool-skill.test.ts', 'packages/core/test/skill/instructions.test.ts'], 'tests': ['packages/core/test/tool-skill.test.ts', 'packages/core/test/skill/instructions.test.ts'], 'focus': ['bun', 'run', 'script/test.ts', 'test/tool-skill.test.ts', 'test/skill/instructions.test.ts', '-t', 'preserves skill metadata when XML context is parsed|preserves metadata in initial and added skill XML'], 'suite': ['bun', 'run', 'script/test.ts', 'test/tool-skill.test.ts', 'test/skill/instructions.test.ts', 'test/skill.test.ts', 'test/session-skill.test.ts'], 'marker': 'preserves', 'failures': 2}, 'finish-diagnostic': {'package': 'packages/core', 'files': ['packages/core/src/session/runner/step.ts', 'packages/core/test/session-runner.test.ts'], 'tests': ['packages/core/test/session-runner.test.ts'], 'focus': ['bun', 'run', 'script/test.ts', 'test/session-runner.test.ts', '-t', 'preserves unknown finish diagnostics'], 'suite': ['bun', 'run', 'script/test.ts', 'test/session-runner.test.ts'], 'marker': 'preserves unknown finish diagnostics', 'failures': 3}, 'config-xdg': {'package': 'services/www', 'files': ['services/www/src/docs/content/config.mdx', 'services/www/src/docs/content/instructions.mdx'], 'tests': [], 'source_checks': [{'cwd': 'packages/util', 'args': ['bun', 'test', 'test/global-roots.test.ts']}]}, 'compaction-ceiling': {'package': 'services/www', 'files': ['services/www/src/docs/content/compaction.mdx'], 'tests': []}, 'malformed-glob': {'package': 'packages/core', 'files': ['packages/core/src/ripgrep.ts', 'packages/core/test/ripgrep.test.ts', 'packages/core/test/tool-search.test.ts'], 'tests': ['packages/core/test/ripgrep.test.ts', 'packages/core/test/tool-search.test.ts'], 'focus': ['bun', 'run', 'script/test.ts', 'test/ripgrep.test.ts', 'test/tool-search.test.ts', '-t', 'reports malformed glob'], 'suite': ['bun', 'run', 'script/test.ts', 'test/ripgrep.test.ts', 'test/tool-search.test.ts', 'test/tool-filesystem.test.ts'], 'marker': 'reports malformed glob', 'failures': 2}, 'kimi-provider-icon': {'package': 'packages/ui', 'files': ['packages/ui/src/components/provider-icon.tsx'], 'tests': [], 'kind': 'external-ui'}, 'minimax-effort': {'package': 'packages/core', 'files': ['packages/core/src/variant.ts', 'packages/core/test/variant.test.ts', 'packages/core/test/model-resolver.test.ts'], 'tests': ['packages/core/test/variant.test.ts', 'packages/core/test/model-resolver.test.ts'], 'focus': ['bun', 'run', 'script/test.ts', 'test/variant.test.ts', 'test/model-resolver.test.ts', '-t', 'MiniMax Messages'], 'suite': ['bun', 'run', 'script/test.ts', 'test/variant.test.ts', 'test/model-resolver.test.ts'], 'marker': 'MiniMax Messages', 'failures': 3}, 'opener-errors': {'package': 'packages/desktop', 'files': ['packages/desktop/src/main/files/index.ts'], 'tests': [], 'kind': 'native-electron'}, 'mcp-prompt-errors': {'package': 'packages/core', 'files': ['packages/core/src/mcp/index.ts', 'packages/core/test/mcp-prompt.test.ts'], 'tests': ['packages/core/test/mcp-prompt.test.ts'], 'focus': ['bun', 'run', 'script/test.ts', 'test/mcp-prompt.test.ts', '-t', 'preserves MCP prompt request errors'], 'suite': ['bun', 'run', 'script/test.ts', 'test/mcp-prompt.test.ts', 'test/mcp.test.ts', 'test/plugin/command.test.ts', 'test/command.test.ts'], 'marker': 'preserves MCP prompt request errors', 'failures': 1}, 'attachment-fallback': {'package': 'packages/core', 'files': ['packages/core/src/session/runner/to-llm-message.ts', 'packages/core/test/session-prompt.test.ts', 'packages/core/test/session-runner-message.test.ts'], 'tests': ['packages/core/test/session-prompt.test.ts', 'packages/core/test/session-runner-message.test.ts'], 'focus': ['bun', 'run', 'script/test.ts', 'test/session-prompt.test.ts', 'test/session-runner-message.test.ts', '-t', 'unsupported attachments'], 'suite': ['bun', 'run', 'script/test.ts', 'test/session-prompt.test.ts', 'test/session-runner-message.test.ts', 'test/session-runner.test.ts'], 'marker': 'unsupported attachments', 'failures': 9}, 'otlp-docs': {'package': 'services/www', 'files': ['services/www/src/docs/content/troubleshooting.mdx'], 'tests': [], 'source_checks': [{'cwd': 'packages/util', 'args': ['bun', 'test', 'test/observability-otlp.test.ts']}]}, 'formatter-timeout': {'package': 'packages/core', 'files': ['packages/core/src/formatter.ts', 'packages/core/test/formatter-timeout.test.ts'], 'tests': ['packages/core/test/formatter-timeout.test.ts'], 'focus': ['bun', 'run', 'script/test.ts', 'test/formatter-timeout.test.ts'], 'suite': ['bun', 'run', 'script/test.ts', 'test/formatter-timeout.test.ts', 'test/formatter.test.ts'], 'marker': 'terminates a hung formatter', 'failures': 1}, 'subagent-depth': {'package': 'packages/core', 'files': ['packages/core/src/tool/plugin/subagent.ts', 'packages/core/test/tool-subagent.test.ts'], 'tests': ['packages/core/test/tool-subagent.test.ts'], 'focus': ['bun', 'run', 'script/test.ts', 'test/tool-subagent.test.ts', '-t', 'advertises subagents within depth limit'], 'suite': ['bun', 'run', 'script/test.ts', 'test/tool-subagent.test.ts'], 'marker': 'advertises subagents within depth limit', 'failures': 9}, 'generic-summary': {'package': 'packages/tui', 'files': ['packages/tui/src/routes/session/index.tsx', 'packages/tui/test/session-generic-tool.test.tsx'], 'tests': ['packages/tui/test/session-generic-tool.test.tsx'], 'focus': ['bun', 'test', '--timeout', '30000', 'test/session-generic-tool.test.tsx'], 'suite': ['bun', 'test', '--timeout', '30000', 'test/session-generic-tool.test.tsx', 'test/cli/tui/inline-tool-wrap-snapshot.test.tsx', 'test/util/tool-display.test.ts'], 'marker': 'generic tool summaries stay collapsed', 'failures': 2}}\ncase=os.environ['CASE'];recipe=recipes[case]\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='8c173a8f3805d8e749d44311054b07e37a1b2ce1'\nassert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()\npatch=base64.b64decode(os.environ['PATCH_BASE64'],validate=True);digest=hashlib.sha256(patch).hexdigest()\nassert digest==os.environ['PATCH_SHA256']\np=proof/'candidate.patch';p.write_bytes(patch)\nrows=subprocess.check_output(['git','apply','--numstat',str(p)],text=True).splitlines()\nassert len(rows)==len(recipe['files']) and {r.split('\\t')[2] for r in rows}==set(recipe['files'])\nsubprocess.run(['git','apply','--check',str(p)],check=True)\nblocks=patch.decode().split('diff --git ')[1:]\nselected=[b for b in blocks if any(b.startswith('a/'+name+' b/'+name+'\\n') for name in recipe['tests'])]\nassert len(selected)==len(recipe['tests'])\n(proof/'tests.patch').write_bytes(''.join('diff --git '+b for b in selected).encode())\n(proof/'recipe.json').write_text(json.dumps(recipe,indent=2))\n(proof/'input.json').write_text(json.dumps({'case':case,'base':'8c173a8f3805d8e749d44311054b07e37a1b2ce1','patch_sha256':digest,'runner':os.environ['RUNNER_OS']},indent=2))\nif recipe.get('kind')=='native-electron':\n for name,data in {'native.ts': '', 'build.ts': ''}.items():(proof/name).write_bytes(base64.b64decode(data))\nprint('Guarded',case,digest,recipe['files'])\nPY"
        },
        {
          "name": "Install upstream pinned Bun and unmodified dependencies",
          "uses": "./.github/actions/setup-bun"
        },
        {
          "name": "Prepare verified native ripgrep before test network guards",
          "if": "runner.os == 'Linux'",
          "run": "mkdir -p \"$RUNNER_TEMP/native-tools\"\ncurl --fail --location --max-time 120 https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz --output \"$RUNNER_TEMP/ripgrep.tar.gz\"\necho \"1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599  $RUNNER_TEMP/ripgrep.tar.gz\" | sha256sum --check\ntar -xzf \"$RUNNER_TEMP/ripgrep.tar.gz\" --strip-components=1 -C \"$RUNNER_TEMP/native-tools\" ripgrep-15.1.0-x86_64-unknown-linux-musl/rg\n\"$RUNNER_TEMP/native-tools/rg\" --version\necho \"$RUNNER_TEMP/native-tools\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "Run original-source regression and package qualification",
          "run": "python - <<'PY'\nimport hashlib,json,os,pathlib,re,shutil,subprocess,sys\nroot=pathlib.Path.cwd();proof=pathlib.Path(os.environ['RUNNER_TEMP'])/'contribution-proof';recipe=json.loads((proof/'recipe.json').read_text());case=os.environ['CASE'];package=root/recipe['package'];results=[]\nbun=shutil.which('bun');assert bun\nassert subprocess.check_output([bun,'--version'],text=True).strip()=='1.4.2'\nsubprocess.run(['git','config','--global','user.name','opencode'],check=True)\nsubprocess.run(['git','config','--global','user.email','bot@opencode.ai'],check=True)\ndef run(name,args,cwd=package):\n args=[bun if a=='bun' else a for a in args]\n print('RUN',name,args,flush=True)\n try:\n  p=subprocess.run(args,cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=1200);code=p.returncode;out=p.stdout\n except subprocess.TimeoutExpired as e:code=124;out=str(e)+'\\n'+str(e.stdout or '')\n (proof/(name+'.log')).write_text(out,encoding='utf-8')\n print('\\n'.join(out.splitlines()[-160:]),flush=True)\n result={'name':name,'args':args,'cwd':str(cwd.relative_to(root)),'exit_code':code};results.append(result)\n return code,out,result\n\ndef native(prefix):\n result_path=proof/(prefix+'-native.json')\n os.environ['OPENCODE_SOURCE_ROOT']=str(root)\n os.environ['OPENCODE_OPENER_RESULT']=str(result_path)\n run(prefix+'-native-build',[bun,str(proof/'build.ts')],root)\n electron=subprocess.check_output(['node','-p',\"require(require.resolve('electron',{paths:[process.cwd()]}))\"],cwd=package,text=True).strip()\n return run(prefix+'-native',['xvfb-run','-a',electron,'--no-sandbox',str(proof/'dist/native.js')],root)\n\ndef capture_docs(prefix):\n for name in recipe['files']:\n  page=name.removeprefix('services/www/src/docs/content/').removesuffix('.mdx')\n  suffix='docs/'+page+'/index.html';label=page.replace('/','-')\n  matches=[p for p in (package/'dist').rglob('*.html') if p.as_posix().endswith(suffix)]\n  for index,p in enumerate(matches):shutil.copyfile(p,proof/f'{prefix}-{label}-{index}.html')\n\nif recipe['tests']:\n subprocess.run(['git','apply','--index',str(proof/'tests.patch')],check=True)\n code,out,result=run('baseline',recipe['focus'])\n should_fail=case!='directory-separator' or os.environ['RUNNER_OS']=='Windows'\n clean=re.sub(r'\\x1b\\[[0-?]*[ -/]*[@-~]','',out)\n forbidden=['Cannot find module','Cannot find package','Unhandled error between tests','Failed to resolve','Test timed out','Timed out waiting for']\n failures=[line for line in clean.splitlines() if '(fail)' in line]\n result['failure_names']=failures\n result['oracle_passed']=(code==1 and len(failures)==recipe['failures'] and all(recipe['marker'] in line for line in failures) and not any(t in clean for t in forbidden)) if should_fail else code==0\n result['expected_regression_failure']=should_fail\n subprocess.run(['git','reset','--hard','HEAD'],check=True)\nelif recipe.get('kind')=='native-electron':\n (proof/'node_modules').symlink_to(package/'node_modules',target_is_directory=True)\n run('prepare-electron',['node',str(package/'node_modules/electron/install.js')],root)\n code,out,result=native('baseline')\n baseline=json.loads((proof/'baseline-native.json').read_text())\n rows=baseline['rows']\n result['oracle_passed']=code==1 and len(rows)==3 and rows[0]['nativeError'] and rows[0]['reply']['exit']['_tag']=='Success' and not rows[0]['pass'] and rows[1]['pass'] and rows[2]['reply']['exit']['_tag']=='Success' and rows[2]['reply']['exit']['value']==rows[2]['nativeResult']\n run('baseline-package-suite',['bun','run','test'])\n run('baseline-typecheck',['bun','typecheck'])\nelif recipe.get('kind')=='external-ui':\n run('baseline-package-suite',['bun','run','test'])\n run('baseline-typecheck',['bun','typecheck'])\nelse:\n for name,args in [('baseline-typecheck',['bun','typecheck']),('baseline-generated',['bun','run','check:generated']),('baseline-build',['bun','run','build'])]:run(name,args)\n capture_docs('baseline')\n\nsubprocess.run(['git','diff','--exit-code'],check=True)\nsubprocess.run(['git','apply',str(proof/'candidate.patch')],check=True)\nsubprocess.run(['git','add','-N','--',*recipe['files']],check=True)\nsubprocess.run(['git','diff','--check'],check=True)\nactual=subprocess.check_output(['git','diff','--binary','--full-index'])\nassert actual==(proof/'candidate.patch').read_bytes(),'Applied patch identity mismatch'\nidentities={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in recipe['files']}\nif recipe['tests']:\n run('candidate-focused',recipe['focus'])\n run('candidate-related',recipe['suite'])\n if os.environ['RUNNER_OS']=='Linux':run('candidate-package-suite',['bun','run','test'])\n run('candidate-typecheck',['bun','typecheck'])\nelif recipe.get('kind')=='native-electron':\n native('candidate')\n candidate=json.loads((proof/'candidate-native.json').read_text())\n assert candidate['passed'] and all(row['pass'] for row in candidate['rows'])\n run('candidate-package-suite',['bun','run','test'])\n run('candidate-typecheck',['bun','typecheck'])\nelif recipe.get('kind')=='external-ui':\n run('candidate-package-suite',['bun','run','test'])\n run('candidate-typecheck',['bun','typecheck'])\nelse:\n for name,args in [('candidate-typecheck',['bun','typecheck']),('candidate-generated',['bun','run','check:generated']),('candidate-build',['bun','run','build'])]:run(name,args)\n capture_docs('candidate')\nfor index,check in enumerate(recipe.get('source_checks',[])):run('source-contract-'+str(index),check['args'],root/check['cwd'])\nif os.environ['RUNNER_OS']=='Linux':run('canonical-check',['bun','run','check'],root)\nsubprocess.run(['git','diff','--check'],check=True)\nassert all(hashlib.sha256((root/p).read_bytes()).hexdigest()==v for p,v in identities.items()),'Source changed during checks'\nassert subprocess.check_output(['git','diff','--binary','--full-index'])==(proof/'candidate.patch').read_bytes()\n(proof/'source-sha256.json').write_text(json.dumps(identities,indent=2))\n(proof/'results.json').write_text(json.dumps(results,indent=2))\nfailed=[x for x in results if not x.get('oracle_passed',x['exit_code']==0)]\nprint(json.dumps({'checks':len(results),'failed':failed},indent=2))\nsys.exit(bool(failed))\nPY"
        },
        {
          "name": "Retain evidence even on failure",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "contribution-${{ inputs.case }}-${{ runner.os }}-${{ github.run_id }}",
            "path": "${{ runner.temp }}/contribution-proof/*.json\n${{ runner.temp }}/contribution-proof/*.log\n${{ runner.temp }}/contribution-proof/*.patch\n${{ runner.temp }}/contribution-proof/*.html\n${{ runner.temp }}/contribution-proof/*.ts",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
