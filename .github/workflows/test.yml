name: qualify-history-workspace-v1
on:
  workflow_dispatch:
    inputs:
      patch_base64:
        required: true
        type: string
      patch_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'rudycelekli/opencode'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_ACTIONS: 'false'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: anomalyco/opencode
          ref: 8c173a8f3805d8e749d44311054b07e37a1b2ce1
          persist-credentials: false
      - name: Guard exact reviewed patch and paths
        env:
          PATCH_BASE64: ${{ inputs.patch_base64 }}
          PATCH_SHA256: ${{ inputs.patch_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          test "$(git rev-parse HEAD)" = 8c173a8f3805d8e749d44311054b07e37a1b2ce1
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess
          data = base64.b64decode(os.environ['PATCH_BASE64'], validate=True)
          expected = '715a0d838299e0480cf052d93ce7e25ae0c34bdc3033fa428bd61a2cfae5f3af'
          assert os.environ['PATCH_SHA256'] == expected
          assert hashlib.sha256(data).hexdigest() == expected
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          patch = root / 'candidate.patch'
          patch.write_bytes(data)
          allowed = {'packages/tui/src/component/prompt/index.tsx', 'packages/tui/test/prompt/history-workspace.test.ts', 'packages/tui/test/prompt/history.test.ts', 'packages/tui/src/prompt/history.tsx', 'packages/tui/src/component/prompt/autocomplete.tsx'}
          rows = subprocess.check_output(['git', 'apply', '--numstat', str(patch)], text=True).splitlines()
          assert len(rows) == 5 and {r.split('\t')[2] for r in rows} == allowed
          blocks = data.decode().split('diff --git ')[1:]
          tests = [b for b in blocks if b.startswith('a/packages/tui/test/prompt/history-workspace.test.ts b/packages/tui/test/prompt/history-workspace.test.ts\n')]
          assert len(tests) == 1
          (root / 'tests.patch').write_text('diff --git ' + tests[0])
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          (root / 'proof/patch.sha256').write_text(expected + '\n')
          PY
      - name: Setup upstream pinned Bun and dependencies
        uses: ./.github/actions/setup-bun
      - name: Capture exact toolchain
        run: |
          set -euo pipefail
          test "$(bun --version)" = "$(node -p "require('./package.json').packageManager.split('@')[1]")"
          git rev-parse HEAD > "$RUNNER_TEMP/proof/base.txt"
          bun --version > "$RUNNER_TEMP/proof/bun-version.txt"
          git config --global user.email 'bot@opencode.ai'
          git config --global user.name 'opencode'
      - name: Prepare verified native ripgrep before test network guards
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-tools"
          curl --fail --location --max-time 120 https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz --output "$RUNNER_TEMP/ripgrep.tar.gz"
          echo "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599  $RUNNER_TEMP/ripgrep.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/ripgrep.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/native-tools" ripgrep-15.1.0-x86_64-unknown-linux-musl/rg
          "$RUNNER_TEMP/native-tools/rg" --version | tee "$RUNNER_TEMP/proof/ripgrep-version.txt"
          echo "$RUNNER_TEMP/native-tools" >> "$GITHUB_PATH"
      - name: Actual baseline must fail the new semantic assertion
        id: baseline_semantic
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/tests.patch"
          git diff --exit-code
          set +e
          (cd packages/tui && bun test --timeout 30000 --only-failures test/prompt/history-workspace.test.ts --test-name-pattern "history submits workspace-relative files from the destination workspace") > "$RUNNER_TEMP/proof/baseline.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/proof/baseline.log"
          test "$result" -ne 0
          python3 - <<'PY'
          import os, pathlib
          text = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'proof/baseline.log').read_text()
          assert 'history submits workspace-relative files from the destination workspace' in text
          assert 'Expected' in text and 'Received' in text
          assert 'workspace-a' in text and 'workspace-b' in text
          assert 'content A' in text and 'content B' in text
          assert '1 fail' in text
          PY
          rm packages/tui/test/prompt/history-workspace.test.ts
      - name: Apply exact candidate
        id: candidate_apply
        if: always() && steps.baseline_semantic.outcome == 'success'
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/candidate.patch"
          git add -N packages/tui/test/prompt/history-workspace.test.ts
          git diff --check
          git diff > "$RUNNER_TEMP/proof/candidate.patch"
          sha256sum packages/tui/src/component/prompt/autocomplete.tsx packages/tui/src/component/prompt/index.tsx packages/tui/src/prompt/history.tsx packages/tui/test/prompt/history-workspace.test.ts packages/tui/test/prompt/history.test.ts > "$RUNNER_TEMP/proof/source-sha256.txt"
      - name: Candidate focused native tests
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          (cd packages/tui && bun test --timeout 30000 --only-failures test/prompt/history.test.ts test/prompt/history-provider.test.tsx test/prompt/history-workspace.test.ts) 2>&1 | tee "$RUNNER_TEMP/proof/focused.log"
      - name: Candidate full TUI suite
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          (cd packages/tui && bun run test) 2>&1 | tee "$RUNNER_TEMP/proof/tui.log"
      - name: Candidate TUI typecheck
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          (cd packages/tui && bun typecheck) 2>&1 | tee "$RUNNER_TEMP/proof/tui-typecheck.log"
      - name: Canonical repository check
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          bun run check 2>&1 | tee "$RUNNER_TEMP/proof/check.log"
      - name: Verify retained source identity
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/proof/source-sha256.txt"
          git diff --check
          git diff > "$RUNNER_TEMP/proof/final.patch"
          cmp "$RUNNER_TEMP/candidate.patch" "$RUNNER_TEMP/proof/final.patch"
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-native-evidence
          path: ${{ runner.temp }}/proof
          if-no-files-found: error
