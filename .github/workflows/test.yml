name: qualify-copilot-free-models
on:
  workflow_dispatch:
    inputs:
      patch_base64:
        required: true
        type: string
      patch_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'rudycelekli/opencode'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_ACTIONS: 'false'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: anomalyco/opencode
          ref: 8c173a8f3805d8e749d44311054b07e37a1b2ce1
          persist-credentials: false
      - name: Guard exact reviewed patch and paths
        env:
          PATCH_BASE64: ${{ inputs.patch_base64 }}
          PATCH_SHA256: ${{ inputs.patch_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          test "$(git rev-parse HEAD)" = 8c173a8f3805d8e749d44311054b07e37a1b2ce1
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess
          data = base64.b64decode(os.environ['PATCH_BASE64'], validate=True)
          expected = '44a3cbcc373e178bfcef2477a9e7f08e5b214fc0b162656f65a0d12f75d5bfff'
          assert os.environ['PATCH_SHA256'] == expected
          assert hashlib.sha256(data).hexdigest() == expected
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          patch = root / 'candidate.patch'
          patch.write_bytes(data)
          allowed = {'packages/core/src/github-copilot/models.ts', 'packages/core/test/github-copilot/models.test.ts'}
          rows = subprocess.check_output(['git', 'apply', '--numstat', str(patch)], text=True).splitlines()
          assert len(rows) == 2 and {r.split('\t')[2] for r in rows} == allowed
          blocks = data.decode().split('diff --git ')[1:]
          tests = [b for b in blocks if b.startswith('a/packages/core/test/github-copilot/models.test.ts b/packages/core/test/github-copilot/models.test.ts\n')]
          assert len(tests) == 1
          (root / 'tests.patch').write_text('diff --git ' + tests[0])
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          (root / 'proof/patch.sha256').write_text(expected + '\n')
          PY
      - name: Setup upstream pinned Bun and dependencies
        uses: ./.github/actions/setup-bun
      - name: Capture exact toolchain
        run: |
          set -euo pipefail
          test "$(bun --version)" = "$(node -p "require('./package.json').packageManager.split('@')[1]")"
          git rev-parse HEAD > "$RUNNER_TEMP/proof/base.txt"
          bun --version > "$RUNNER_TEMP/proof/bun-version.txt"
          git config --global user.email 'bot@opencode.ai'
          git config --global user.name 'opencode'
      - name: Actual baseline must fail the new semantic assertion
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/tests.patch"
          git diff --exit-code -- packages/core/src/github-copilot/models.ts
          set +e
          (cd packages/core && bun run script/test.ts test/github-copilot/models.test.ts) > "$RUNNER_TEMP/proof/baseline.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/proof/baseline.log"
          test "$result" -ne 0
          python3 - <<'PY'
          import os, pathlib
          text = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'proof/baseline.log').read_text()
          assert 'keeps policy-enabled Copilot Free models available when the picker is disabled' in text
          assert 'Expected: true' in text and 'Received: false' in text
          assert '1 fail' in text
          PY
          git restore packages/core/test/github-copilot/models.test.ts
      - name: Apply exact candidate
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/candidate.patch"
          git diff --check
          git diff > "$RUNNER_TEMP/proof/candidate.patch"
          sha256sum packages/core/src/github-copilot/models.ts packages/core/test/github-copilot/models.test.ts > "$RUNNER_TEMP/proof/source-sha256.txt"
      - name: Candidate focused native tests
        run: |
          set -euo pipefail
          (cd packages/core && bun run script/test.ts test/github-copilot/models.test.ts test/plugin/provider-github-copilot.test.ts) 2>&1 | tee "$RUNNER_TEMP/proof/focused.log"
      - name: Candidate full Core suite
        run: |
          set -euo pipefail
          (cd packages/core && bun run test) 2>&1 | tee "$RUNNER_TEMP/proof/core.log"
      - name: Candidate Core typecheck
        run: |
          set -euo pipefail
          (cd packages/core && bun typecheck) 2>&1 | tee "$RUNNER_TEMP/proof/core-typecheck.log"
      - name: Canonical repository check
        run: |
          set -euo pipefail
          bun run check 2>&1 | tee "$RUNNER_TEMP/proof/check.log"
      - name: Verify retained source identity
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/proof/source-sha256.txt"
          git diff --check
          git diff > "$RUNNER_TEMP/proof/final.patch"
          cmp "$RUNNER_TEMP/candidate.patch" "$RUNNER_TEMP/proof/final.patch"
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: copilot-native-evidence
          path: ${{ runner.temp }}/proof
          if-no-files-found: error
