name: qualify-gateway-overflow-review-v2
on:
  workflow_dispatch:
    inputs:
      patch_base64:
        required: true
        type: string
      patch_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'rudycelekli/opencode'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_ACTIONS: 'false'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: anomalyco/opencode
          ref: 8c173a8f3805d8e749d44311054b07e37a1b2ce1
          persist-credentials: false
      - name: Guard exact reviewed patch and paths
        env:
          PATCH_BASE64: ${{ inputs.patch_base64 }}
          PATCH_SHA256: ${{ inputs.patch_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          test "$(git rev-parse HEAD)" = 8c173a8f3805d8e749d44311054b07e37a1b2ce1
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess
          data = base64.b64decode(os.environ['PATCH_BASE64'], validate=True)
          expected = 'da13a6f50f97d04521d25a022438b7f0f7f8fe50d954fc3c13b614e32f03e9e5'
          assert os.environ['PATCH_SHA256'] == expected
          assert hashlib.sha256(data).hexdigest() == expected
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          patch = root / 'candidate.patch'
          patch.write_bytes(data)
          allowed = {'packages/ai/src/provider-error.ts', 'packages/ai/test/provider-error.test.ts'}
          rows = subprocess.check_output(['git', 'apply', '--numstat', str(patch)], text=True).splitlines()
          assert len(rows) == 2 and {r.split('\t')[2] for r in rows} == allowed
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          blocks = data.decode().split('diff --git ')[1:]
          tests = [b for b in blocks if any(b.startswith('a/'+name+' b/'+name+'\n') for name in ['packages/ai/test/provider-error.test.ts'])]
          assert len(tests) == 1
          (root / 'tests.patch').write_text(''.join('diff --git '+b for b in tests))
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          (root / 'proof/patch.sha256').write_text(expected + '\n')
          PY
      - name: Setup upstream pinned Bun and dependencies
        uses: ./.github/actions/setup-bun
      - name: Capture exact toolchain
        run: |
          set -euo pipefail
          test "$(bun --version)" = "$(node -p "require('./package.json').packageManager.split('@')[1]")"
          git rev-parse HEAD > "$RUNNER_TEMP/proof/base.txt"
          bun --version > "$RUNNER_TEMP/proof/bun-version.txt"
          git config --global user.email 'bot@opencode.ai'
          git config --global user.name 'opencode'
      - name: Prepare verified native ripgrep before test network guards
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-tools"
          curl --fail --location --max-time 120 https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz --output "$RUNNER_TEMP/ripgrep.tar.gz"
          echo "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599  $RUNNER_TEMP/ripgrep.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/ripgrep.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/native-tools" ripgrep-15.1.0-x86_64-unknown-linux-musl/rg
          "$RUNNER_TEMP/native-tools/rg" --version | tee "$RUNNER_TEMP/proof/ripgrep-version.txt"
          echo "$RUNNER_TEMP/native-tools" >> "$GITHUB_PATH"
      - name: Actual baseline classifier assertion
        id: baseline_semantic
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/tests.patch"
          set +e
          (cd packages/ai && bun test --timeout 30000 --only-failures test/provider-error.test.ts) > "$RUNNER_TEMP/proof/baseline.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/proof/baseline.log"
          test "$result" -eq 1
          python3 - <<'PY'
          import os,pathlib
          text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'proof/baseline.log').read_text()
          assert '37 pass' in text and '1 fail' in text
          assert '(fail) provider error classification > classifies OpenCode Go configured input limits' in text
          assert 'Expected' in text and 'Received' in text and 'context-overflow' in text and "configured input limit" in text
          assert all(marker not in text for marker in ['Cannot find module','ModuleNotFound','Test timed out','SyntaxError','error TS'])
          PY
          git restore -- packages/ai/test/provider-error.test.ts
          git diff --exit-code
      - name: Apply candidate and verify initial full-index identity
        id: candidate_apply
        if: always() && steps.baseline_semantic.outcome == 'success'
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/candidate.patch"
          git diff --check
          git diff --binary --full-index > "$RUNNER_TEMP/proof/initial-full-index.patch"
          cmp "$RUNNER_TEMP/candidate.patch" "$RUNNER_TEMP/proof/initial-full-index.patch"
          test -z "$(git ls-files --others --exclude-standard)"
          sha256sum packages/ai/src/provider-error.ts packages/ai/test/provider-error.test.ts > "$RUNNER_TEMP/proof/source-sha256.txt"
      - name: Focused classifier tests
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          (cd packages/ai && bun test --timeout 30000 --only-failures test/provider-error.test.ts) 2>&1 | tee "$RUNNER_TEMP/proof/focused.log"
      - name: Full AI replay tests
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          (cd packages/ai && bun run test) 2>&1 | tee "$RUNNER_TEMP/proof/ai-tests.log"
      - name: Full Core tests
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          (cd packages/core && bun run test) 2>&1 | tee "$RUNNER_TEMP/proof/core-tests.log"
      - name: AI typecheck
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          (cd packages/ai && bun typecheck) 2>&1 | tee "$RUNNER_TEMP/proof/ai-typecheck.log"
      - name: Core typecheck
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          (cd packages/core && bun typecheck) 2>&1 | tee "$RUNNER_TEMP/proof/core-typecheck.log"
      - name: Canonical repository check
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          (bun run check) 2>&1 | tee "$RUNNER_TEMP/proof/check.log"
      - name: Verify final deterministic full-index source identity
        if: always() && steps.candidate_apply.outcome == 'success'
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/proof/source-sha256.txt"
          git diff --check
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --binary --full-index > "$RUNNER_TEMP/proof/final-full-index.patch"
          cmp "$RUNNER_TEMP/proof/initial-full-index.patch" "$RUNNER_TEMP/proof/final-full-index.patch"
          cmp "$RUNNER_TEMP/candidate.patch" "$RUNNER_TEMP/proof/final-full-index.patch"
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateway-overflow-native-evidence
          path: ${{ runner.temp }}/proof
          if-no-files-found: error
