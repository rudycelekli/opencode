{
  "name": "capture-directory-proof",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native": {
      "if": "github.repository == 'rudycelekli/opencode'",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-24.04",
            "windows-2022"
          ]
        }
      },
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 20,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "env": {
        "GITHUB_ACTIONS": "false",
        "NO_COLOR": "1"
      },
      "steps": [
        {
          "name": "Preserve LF source",
          "run": "git config --global core.autocrlf false"
        },
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "repository": "anomalyco/opencode",
            "ref": "8c173a8f3805d8e749d44311054b07e37a1b2ce1",
            "persist-credentials": false
          }
        },
        {
          "uses": "./.github/actions/setup-bun"
        },
        {
          "name": "Capture actual production renderer before and after",
          "run": "python - <<'PY'\nimport base64,hashlib,json,os,pathlib,re,subprocess\nroot=pathlib.Path.cwd();proof=pathlib.Path(os.environ['RUNNER_TEMP'])/'directory-capture-proof';proof.mkdir()\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='8c173a8f3805d8e749d44311054b07e37a1b2ce1'\npatch=base64.b64decode('');diag=base64.b64decode('')\nassert hashlib.sha256(patch).hexdigest()=='ecc3b474f5b38e3e6982ffb16763d3be108de7eaf0ce2b182cd39a1529216fb6'\n(proof/'candidate.patch').write_bytes(patch);(proof/'diagnostic.patch').write_bytes(diag)\nblocks=patch.decode().split('diff --git ')[1:]\ntests=''.join('diff --git '+b for b in blocks if b.startswith('a/packages/tui/test/'))\n(proof/'tests.patch').write_bytes(tests.encode())\nresults=[]\nfor condition in ['baseline','candidate']:\n subprocess.run(['git','reset','--hard','HEAD'],check=True)\n subprocess.run(['git','apply',str(proof/('tests.patch' if condition=='baseline' else 'candidate.patch'))],check=True)\n expected=subprocess.check_output(['git','show','HEAD:packages/tui/src/component/prompt/autocomplete.tsx']) if condition=='baseline' else None\n if expected is not None:assert (root/'packages/tui/src/component/prompt/autocomplete.tsx').read_bytes()==expected\n source=hashlib.sha256((root/'packages/tui/src/component/prompt/autocomplete.tsx').read_bytes()).hexdigest()\n subprocess.run(['git','apply',str(proof/'diagnostic.patch')],check=True)\n capture=proof/condition;capture.mkdir();env={**os.environ,'OPENCODE_DIRECTORY_CAPTURE_DIR':str(capture)}\n p=subprocess.run(['bun','test','--timeout','30000','test/app-lifecycle.test.tsx','-t','/cd Tab completion'],cwd=root/'packages/tui',env=env,capture_output=True,text=True,timeout=180)\n (proof/(condition+'.log')).write_text(p.stdout+p.stderr)\n rows=[json.loads(f.read_text()) for f in capture.glob('*.json')]\n assert rows and all(row['platform']==('win32' if os.environ['RUNNER_OS']=='Windows' else 'linux') for row in rows)\n should_fail=condition=='baseline' and os.environ['RUNNER_OS']=='Windows'\n assert p.returncode==(1 if should_fail else 0)\n nested=next(row for row in rows if row['name']=='nested')\n assert nested['input']==('/cd nested/\\\\' if should_fail else '/cd nested/')\n results.append({'condition':condition,'exit':p.returncode,'source_sha256':source,'frames':rows})\nassert hashlib.sha256((root/'packages/tui/src/component/prompt/autocomplete.tsx').read_bytes()).hexdigest()==results[-1]['source_sha256']\n(proof/'results.json').write_text(json.dumps({'base':'8c173a8f3805d8e749d44311054b07e37a1b2ce1','patch_sha256':'ecc3b474f5b38e3e6982ffb16763d3be108de7eaf0ce2b182cd39a1529216fb6','diagnostic_sha256':hashlib.sha256(diag).hexdigest(),'canonical_qualification_run':39063637906,'results':results},indent=2))\nPY"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "if": "always()",
          "with": {
            "name": "directory-frames-${{ runner.os }}-${{ github.run_id }}",
            "path": "${{ runner.temp }}/directory-capture-proof",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
