{
  "name": "qualify-dual-oct20",
  "run-name": "Oct20 qualify ${{ inputs.case }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "case": {
          "required": true,
          "type": "choice",
          "options": [
            "patch-same-path",
            "plugin-symlink-cache",
            "utf8-mutation",
            "compaction-current"
          ]
        },
        "patch_base64": {
          "required": true,
          "type": "string"
        },
        "patch_sha256": {
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native": {
      "if": "github.repository == 'rudycelekli/opencode'",
      "runs-on": "${{ matrix.os }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": "${{ fromJSON(inputs.case == 'plugin-symlink-cache' && '[\"ubuntu-24.04\",\"windows-2022\"]' || '[\"ubuntu-24.04\"]') }}"
        }
      },
      "timeout-minutes": 40,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "env": {
        "CASE": "${{ inputs.case }}",
        "NO_COLOR": "1",
        "GITHUB_ACTIONS": "false",
        "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24": "true"
      },
      "steps": [
        {
          "name": "Preserve LF source",
          "run": "git config --global core.autocrlf false"
        },
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "repository": "anomalyco/opencode",
            "ref": "0718864d49a5241e7df5b302b35caed2518171a0",
            "persist-credentials": false
          }
        },
        {
          "uses": "./.github/actions/setup-bun"
        },
        {
          "name": "Prepare pinned native ripgrep",
          "if": "runner.os == 'Linux'",
          "run": "mkdir -p \"$RUNNER_TEMP/native-tools\"\ncurl --fail --location --max-time 120 https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz --output \"$RUNNER_TEMP/ripgrep.tar.gz\"\necho \"1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599  $RUNNER_TEMP/ripgrep.tar.gz\" | sha256sum --check\ntar -xzf \"$RUNNER_TEMP/ripgrep.tar.gz\" --strip-components=1 -C \"$RUNNER_TEMP/native-tools\" ripgrep-15.1.0-x86_64-unknown-linux-musl/rg\necho \"$RUNNER_TEMP/native-tools\" >> \"$GITHUB_PATH\""
        },
        {
          "name": "Qualify exact source and regression",
          "env": {
            "PATCH_BASE64": "${{ inputs.patch_base64 }}",
            "PATCH_SHA256": "${{ inputs.patch_sha256 }}"
          },
          "run": "python - <<'PY'\nimport base64,hashlib,json,os,pathlib,subprocess,re,sys\nroot=pathlib.Path.cwd();proof=pathlib.Path(os.environ['RUNNER_TEMP'])/'dual-proof';proof.mkdir()\nrecipes={'patch-same-path': {'package': 'packages/core', 'files': ['packages/core/src/tool/plugin/patch.ts', 'packages/core/test/tool-patch.test.ts'], 'tests': ['packages/core/test/tool-patch.test.ts'], 'focus': ['bun', 'run', 'script/test.ts', 'test/tool-patch.test.ts', '-t', 'keeps an updated file when the move destination is the same path'], 'related': ['bun', 'run', 'script/test.ts', 'test/tool-patch.test.ts'], 'failures': 3, 'marker': 'keeps an updated file when the move destination is the same path'}, 'plugin-symlink-cache': {'package': 'packages/plugin', 'files': ['packages/plugin/src/source.bun.ts', 'packages/plugin/test/source.test.ts'], 'tests': ['packages/plugin/test/source.test.ts'], 'focus': ['bun', 'test', 'test/source.test.ts'], 'related': ['bun', 'run', 'test'], 'failures': 1, 'marker': 'reloads a changed standalone plugin through a symlinked'}, 'utf8-mutation': {'package': 'packages/core', 'files': ['packages/core/src/file-mutation.ts', 'packages/core/src/tool/plugin/edit.ts', 'packages/core/src/tool/plugin/write.ts', 'packages/core/test/tool-edit.test.ts', 'packages/core/test/tool-patch.test.ts', 'packages/core/test/tool-write.test.ts'], 'tests': ['packages/core/test/tool-edit.test.ts', 'packages/core/test/tool-patch.test.ts', 'packages/core/test/tool-write.test.ts'], 'focus': ['bun', 'run', 'script/test.ts', 'test/tool-edit.test.ts', 'test/tool-patch.test.ts', 'test/tool-write.test.ts', '-t', 'rejects non-UTF-8'], 'related': ['bun', 'run', 'script/test.ts', 'test/tool-edit.test.ts', 'test/tool-patch.test.ts', 'test/tool-write.test.ts'], 'failures': 6, 'marker': 'rejects non-UTF-8'}, 'compaction-current': {'package': 'services/www', 'files': ['services/www/src/docs/content/compaction.mdx'], 'tests': [], 'docs': True}};recipe=recipes[os.environ['CASE']];package=root/recipe['package'];results=[]\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='0718864d49a5241e7df5b302b35caed2518171a0'\nassert subprocess.check_output(['bun','--version'],text=True).strip()=='1.4.2'\nsubprocess.run(['git','config','user.name','opencode'],check=True);subprocess.run(['git','config','user.email','bot@opencode.ai'],check=True)\npatch=base64.b64decode(os.environ['PATCH_BASE64'],validate=True)\nassert hashlib.sha256(patch).hexdigest()==os.environ['PATCH_SHA256']\np=proof/'candidate.patch';p.write_bytes(patch)\nrows=subprocess.check_output(['git','apply','--numstat',str(p)],text=True).splitlines()\nassert {row.split('\\t')[2] for row in rows}==set(recipe['files']) and len(rows)==len(recipe['files'])\nsubprocess.run(['git','apply','--check',str(p)],check=True)\nblocks=patch.decode().split('diff --git ')[1:]\ntests=''.join('diff --git '+b for b in blocks if any(b.startswith('a/'+name+' b/'+name+'\\n') for name in recipe['tests']))\n(proof/'tests.patch').write_bytes(tests.encode())\n(proof/'input.json').write_text(json.dumps({'base':'0718864d49a5241e7df5b302b35caed2518171a0','case':os.environ['CASE'],'runner':os.environ['RUNNER_OS'],'patch_sha256':hashlib.sha256(patch).hexdigest()},indent=2))\ndef run(name,args,cwd=package):\n print('RUN',name,args,flush=True)\n p=subprocess.run(args,cwd=cwd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=1200)\n (proof/(name+'.log')).write_text(p.stdout,encoding='utf-8')\n row={'name':name,'args':args,'cwd':str(cwd.relative_to(root)),'exit_code':p.returncode};results.append(row)\n (proof/'results.json').write_text(json.dumps(results,indent=2))\n print('\\n'.join(p.stdout.splitlines()[-70:]),flush=True)\n return p.returncode,p.stdout,row\nif recipe.get('docs'):\n for label,args in [('typecheck',['bun','typecheck']),('generated',['bun','run','check:generated']),('build',['bun','run','build'])]: run('baseline-'+label,args)\nelse:\n if os.environ['CASE']=='patch-same-path': run('baseline-package',['bun','run','test'])\n subprocess.run(['git','apply','--index',str(proof/'tests.patch')],check=True)\n code,out,result=run('baseline',recipe['focus'])\n clean=re.sub(r'\\x1b\\[[0-?]*[ -/]*[@-~]','',out);fails=[line for line in clean.splitlines() if '(fail)' in line]\n result['failure_names']=fails\n result['oracle_passed']=code==1 and len(fails)==recipe['failures'] and all(recipe['marker'] in line for line in fails) and not any(x in clean for x in ['Cannot find module','Cannot find package','Unhandled error between tests','Test timed out','Timed out waiting for'])\nsubprocess.run(['git','reset','--hard','HEAD'],check=True)\nsubprocess.run(['git','apply',str(p)],check=True);subprocess.run(['git','add','-N','--',*recipe['files']],check=True)\nassert subprocess.check_output(['git','diff','--binary','--full-index'])==patch\nidentities={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in recipe['files']}\nrun('candidate-typecheck',['bun','typecheck'])\nif recipe.get('docs'):\n run('candidate-generated',['bun','run','check:generated']);run('candidate-build',['bun','run','build'])\nelse:\n run('candidate-focused',recipe['focus']);run('candidate-related',recipe['related'])\n if os.environ['RUNNER_OS']=='Linux': run('candidate-package',['bun','run','test'])\nif os.environ['RUNNER_OS']=='Linux': run('canonical-check',['bun','run','check'],root)\nsubprocess.run(['git','diff','--check'],check=True)\nassert subprocess.check_output(['git','diff','--binary','--full-index'])==patch\nassert all(hashlib.sha256((root/name).read_bytes()).hexdigest()==value for name,value in identities.items())\n(proof/'source-sha256.json').write_text(json.dumps(identities,indent=2))\n(proof/'results.json').write_text(json.dumps(results,indent=2))\nsys.exit(any(not row.get('oracle_passed',row['exit_code']==0) for row in results))\nPY"
        },
        {
          "name": "Retain proof files",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "dual-${{ inputs.case }}-${{ runner.os }}-${{ github.run_id }}",
            "path": "${{ runner.temp }}/dual-proof/*.json\n${{ runner.temp }}/dual-proof/*.log\n${{ runner.temp }}/dual-proof/*.patch",
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
