{
  "name": "Oct20 checksum browser proof",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "case": {
          "type": "string",
          "required": false
        },
        "patch_base64": {
          "type": "string",
          "required": false
        },
        "patch_sha256": {
          "type": "string",
          "required": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "probe": {
      "if": "github.repository == 'rudycelekli/opencode'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 35,
      "env": {
        "CI": "true",
        "GITHUB_ACTIONS": "false",
        "NO_COLOR": "1",
        "PLAYWRIGHT_STORYBOOK_PORT": "6107",
        "PLAYWRIGHT_BROWSERS_PATH": "${{ github.workspace }}/.playwright-browsers",
        "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "repository": "anomalyco/opencode",
            "ref": "c600cddc68f1c5488448d6410b1b248489bc00f8",
            "persist-credentials": false
          }
        },
        {
          "uses": "./.github/actions/setup-bun"
        },
        {
          "name": "Pin browser installer Node to upstream documented compatible version",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.15"
          }
        },
        {
          "name": "Install Chromium with system dependencies",
          "working-directory": "packages/app",
          "run": "bunx playwright install --with-deps chromium"
        },
        {
          "name": "Verify visible large-file update before and after exact utility patch",
          "env": {
            "BASE": "c600cddc68f1c5488448d6410b1b248489bc00f8",
            "FIXTURE_PATCH": "",
            "FIX_PATCH": "",
            "FIXTURE_SHA256": "1938425ccd8d2478fe9b84fb813b7c892807d8eb54c227832efd00f6c1407e71",
            "FIX_SHA256": "96eca99a5bde0202885118c26fedc445a5d7214b591c7cfe9f6dcaaee5544e47"
          },
          "run": "python - <<'PY'\nimport base64,hashlib,json,os,pathlib,re,subprocess,sys\nroot=pathlib.Path.cwd();proof=pathlib.Path(os.environ['RUNNER_TEMP'])/'ui-proof';proof.mkdir()\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['BASE']\nfixture=base64.b64decode(os.environ['FIXTURE_PATCH'],validate=True)\nfix=base64.b64decode(os.environ['FIX_PATCH'],validate=True)\nassert hashlib.sha256(fixture).hexdigest()==os.environ['FIXTURE_SHA256']\nassert hashlib.sha256(fix).hexdigest()==os.environ['FIX_SHA256']\nfor name,data in [('fixture.patch',fixture),('fix.patch',fix)]: (proof/name).write_bytes(data)\nsubprocess.run(['git','apply','--check',str(proof/'fixture.patch')],check=True)\nsubprocess.run(['git','apply',str(proof/'fixture.patch')],check=True)\n(proof/'input.json').write_text(json.dumps({'base':os.environ['BASE'],'fixture_sha256':hashlib.sha256(fixture).hexdigest(),'fix_sha256':hashlib.sha256(fix).hexdigest()},indent=2))\ncommand=['bun','run','test:components','--','component-tests/probe-checksum.spec.ts','--workers=2','--retries=0']\nresults=[]\ndef run(name,args):\n p=subprocess.run(args,cwd=root/'packages/session-ui',stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=1200)\n (proof/(name+'.log')).write_text(p.stdout)\n results.append({'name':name,'exit_code':p.returncode,'command':args})\n (proof/'results.json').write_text(json.dumps(results,indent=2))\n print(p.stdout[-22000:])\n return p\np=run('baseline',command)\ntext=re.sub(r'\\x1b\\[[0-?]*[ -/]*[@-~]','',p.stdout)\noracle=p.returncode==1 and '1 failed' in text and 'BASELINE_INITIAL_TAIL_RENDERED' in text and 'TAIL_CHANGED' in text and 'TAIL_NEW' in text and 'Cannot find module' not in text\n(proof/'baseline-oracle.json').write_text(json.dumps({'passed':oracle,'reason':'actual visible old tail, clicked production reactive update, new tail missing'},indent=2))\nif not oracle: raise SystemExit('No qualifying browser failure: preserve diagnosis, do not claim a fix')\nsubprocess.run(['git','apply','--check',str(proof/'fix.patch')],check=True)\nsubprocess.run(['git','apply',str(proof/'fix.patch')],check=True)\nfiles=['packages/util/src/encode.ts','packages/util/src/encode.test.ts']\nassert subprocess.check_output(['git','diff','--binary','--full-index','--',*files])==fix\nhashes={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in files}\np=run('candidate',command+['--repeat-each=10'])\nassert subprocess.check_output(['git','diff','--binary','--full-index','--',*files])==fix\nassert all(hashlib.sha256((root/name).read_bytes()).hexdigest()==value for name,value in hashes.items())\n(proof/'source-sha256.json').write_text(json.dumps(hashes,indent=2))\nsys.exit(p.returncode)\n\nPY"
        },
        {
          "name": "Preserve diagnostic evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "ui-wave2-${{ github.run_id }}",
            "path": "${{ runner.temp }}/ui-proof/*.json\n${{ runner.temp }}/ui-proof/*.log\n${{ runner.temp }}/ui-proof/*.patch\npackages/session-ui/component-tests/test-results/**/*.png\npackages/session-ui/component-tests/test-results/**/*.md",
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}