{
  "name": "Oct20 documented guard proof",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "case": {
          "type": "string",
          "required": false
        },
        "patch_base64": {
          "type": "string",
          "required": false
        },
        "patch_sha256": {
          "type": "string",
          "required": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "probe": {
      "if": "github.repository == 'rudycelekli/opencode'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 35,
      "env": {
        "CI": "true",
        "GITHUB_ACTIONS": "false",
        "NO_COLOR": "1",
        "PLAYWRIGHT_STORYBOOK_PORT": "6107",
        "PLAYWRIGHT_BROWSERS_PATH": "${{ github.workspace }}/.playwright-browsers",
        "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "repository": "anomalyco/opencode",
            "ref": "c600cddc68f1c5488448d6410b1b248489bc00f8",
            "persist-credentials": false
          }
        },
        {
          "uses": "./.github/actions/setup-bun"
        },
        {
          "name": "Execute copied documented hook against real read input schema and verify website",
          "env": {
            "BASE": "c600cddc68f1c5488448d6410b1b248489bc00f8",
            "DOC_PATCH": "",
            "PATCH_SHA256": "328c2f333b00450c27e85281f7deeae49772a69fdc580d892cdb7a0e5d35d9c7",
            "PROOF_SCRIPT": ""
          },
          "run": "python - <<'PY'\nimport base64,hashlib,json,os,pathlib,subprocess,sys\nroot=pathlib.Path.cwd();proof=pathlib.Path(os.environ['RUNNER_TEMP'])/'ui-proof';proof.mkdir()\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['BASE']\npatch=base64.b64decode(os.environ['DOC_PATCH'],validate=True)\nassert hashlib.sha256(patch).hexdigest()==os.environ['PATCH_SHA256']\n(proof/'candidate.patch').write_bytes(patch)\nscript=root/'packages/core/test/doc-guard-proof.mjs';script.write_bytes(base64.b64decode(os.environ['PROOF_SCRIPT'],validate=True))\nresults=[]\ndef run(name,args,cwd):\n p=subprocess.run(args,cwd=cwd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=1200)\n (proof/(name+'.log')).write_text(p.stdout)\n results.append({'name':name,'exit_code':p.returncode,'command':args})\n (proof/'results.json').write_text(json.dumps(results,indent=2))\n print(p.stdout[-18000:])\n return p\ncommand=['bun','run','test/doc-guard-proof.mjs']\np=run('baseline-hook',command,root/'packages/core')\nassert p.returncode==1 and '\"protected_path_rejected\":false' in p.stdout and '\"ordinary_path_allowed\":true' in p.stdout\nfor name,args in [('typecheck',['bun','typecheck']),('generated',['bun','run','check:generated']),('build',['bun','run','build'])]:\n assert run('baseline-'+name,args,root/'services/www').returncode==0\nsubprocess.run(['git','apply','--check',str(proof/'candidate.patch')],check=True)\nsubprocess.run(['git','apply',str(proof/'candidate.patch')],check=True)\ndoc='services/www/src/docs/content/build/plugins/migrate-v1.mdx'\nassert subprocess.check_output(['git','diff','--binary','--full-index','--',doc])==patch\nsource=hashlib.sha256((root/doc).read_bytes()).hexdigest()\np=run('candidate-hook',command,root/'packages/core')\nassert p.returncode==0 and '\"protected_path_rejected\":true' in p.stdout and '\"ordinary_path_allowed\":true' in p.stdout\nfor name,args in [('typecheck',['bun','typecheck']),('generated',['bun','run','check:generated']),('build',['bun','run','build'])]:\n assert run('candidate-'+name,args,root/'services/www').returncode==0\nassert run('root-check',['bun','run','check'],root).returncode==0\nassert subprocess.check_output(['git','diff','--binary','--full-index','--',doc])==patch\nassert hashlib.sha256((root/doc).read_bytes()).hexdigest()==source\n(proof/'input.json').write_text(json.dumps({'base':os.environ['BASE'],'patch_sha256':hashlib.sha256(patch).hexdigest()},indent=2))\n(proof/'source-sha256.json').write_text(json.dumps({doc:source},indent=2))\nsubprocess.run(['git','diff','--check'],check=True)\n\nPY"
        },
        {
          "name": "Preserve diagnostic evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "ui-wave2-${{ github.run_id }}",
            "path": "${{ runner.temp }}/ui-proof/*.json\n${{ runner.temp }}/ui-proof/*.log\n${{ runner.temp }}/ui-proof/*.patch\npackages/session-ui/component-tests/test-results/**/*.png\npackages/session-ui/component-tests/test-results/**/*.md",
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}