{
  "name": "Oct21 desktop review visual evidence",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "case": {
          "type": "string",
          "required": false
        },
        "patch_base64": {
          "type": "string",
          "required": false
        },
        "patch_sha256": {
          "type": "string",
          "required": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "probe": {
      "if": "github.repository == 'rudycelekli/opencode'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "env": {
        "CI": "true",
        "GITHUB_ACTIONS": "false",
        "NO_COLOR": "1",
        "PLAYWRIGHT_STORYBOOK_PORT": "6107",
        "PLAYWRIGHT_BROWSERS_PATH": "${{ github.workspace }}/.playwright-browsers",
        "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "repository": "anomalyco/opencode",
            "ref": "15adc3d91ecc6955ee0918607a5593e23bd4d538",
            "persist-credentials": false
          }
        },
        {
          "uses": "./.github/actions/setup-bun"
        },
        {
          "name": "Pin browser installer Node to upstream documented compatible version",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.15"
          }
        },
        {
          "name": "Install Chromium with system dependencies",
          "working-directory": "packages/app",
          "run": "bunx playwright install --with-deps chromium"
        },
        {
          "name": "Capture actual editor before and after exact fix",
          "env": {
            "BASE": "15adc3d91ecc6955ee0918607a5593e23bd4d538",
            "FIXTURE_PATCH": "",
            "FIX_PATCH": "",
            "FIXTURE_SHA256": "75b0a3a2524f3eef143d072c863e7471d460a61de3a2a645c4a4867913f68c3b",
            "FIX_SHA256": "e4bf9453f906d24c8d1d4f6533aa93c9d0d77286268ac208f25df58cfd177eba"
          },
          "run": "python - <<'PY'\nimport base64,hashlib,json,os,pathlib,re,subprocess\nroot=pathlib.Path.cwd();proof=pathlib.Path(os.environ['RUNNER_TEMP'])/'ui-proof';proof.mkdir()\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['BASE']\npatches={}\nfor kind in ['FIXTURE','FIX']:\n data=base64.b64decode(os.environ[kind+'_PATCH'],validate=True)\n assert hashlib.sha256(data).hexdigest()==os.environ[kind+'_SHA256']\n p=proof/(kind.lower()+'.patch');p.write_bytes(data);patches[kind]=p\nsubprocess.run(['git','apply',str(patches['FIXTURE'])],check=True)\ntest=root/'packages/app/e2e/regression/review.spec.ts';original=test.read_text();original_hash=hashlib.sha256(test.read_bytes()).hexdigest()\nneedle='  await expect(choice).toBeVisible()'\nassert original.count(needle)==1\ninstrumented=original.replace(needle,'  if (process.env.GRADIA_REVIEW_CAPTURE === \"candidate\") await expect(choice).toBeVisible()\\n  await page.screenshot({ path: process.env.GRADIA_REVIEW_CAPTURE_PATH, fullPage: true })\\n'+needle)\ntest.write_text(instrumented)\n(proof/'visual-instrumentation.patch').write_bytes(subprocess.check_output(['git','diff','--binary','--full-index','--','packages/app/e2e/regression/review.spec.ts']))\ncommand=['bun','run','test:e2e','--','e2e/regression/review.spec.ts','--grep','desktop review comments suggest workspace file mentions','--project=chromium','--workers=1','--retries=0','--reporter=line']\nresults=[]\nfor kind in ['baseline','candidate']:\n if kind=='candidate':subprocess.run(['git','apply',str(patches['FIX'])],check=True)\n env=dict(os.environ,GRADIA_REVIEW_CAPTURE=kind,GRADIA_REVIEW_CAPTURE_PATH=str(proof/(kind+'-review.png')))\n p=subprocess.run(command,cwd=root/'packages/app',env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=500)\n (proof/(kind+'-visual.log')).write_text(p.stdout);print(p.stdout[-5000:]);results.append({'kind':kind,'exit_code':p.returncode,'png_sha256':hashlib.sha256((proof/(kind+'-review.png')).read_bytes()).hexdigest()})\n assert p.returncode==(1 if kind=='baseline' else 0)\n if kind=='baseline':assert '1 failed' in p.stdout and 'line-comment-v2-mention-item' in p.stdout\nassert hashlib.sha256(test.read_bytes()).hexdigest()==hashlib.sha256(instrumented.encode()).hexdigest()\ntest.write_text(original);assert hashlib.sha256(test.read_bytes()).hexdigest()==original_hash\nfiles=['packages/gui-extensions/src/review/panel.tsx','packages/session-ui/src/v2/components/session-review-file-preview-v2.tsx']\nassert subprocess.check_output(['git','diff','--binary','--full-index','--',*files])==patches['FIX'].read_bytes()\n(proof/'visual-result.json').write_text(json.dumps({'purpose':'Private screenshot instrumentation only; exact committed keeper qualification in39548173055','base':os.environ['BASE'],'fixture_sha256':os.environ['FIXTURE_SHA256'],'fix_sha256':os.environ['FIX_SHA256'],'committed_keeper_sha256':original_hash,'results':results},indent=2))\n\nPY"
        },
        {
          "name": "Preserve diagnostic evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "ui-wave2-${{ github.run_id }}",
            "path": "${{ runner.temp }}/ui-proof/*.json\n${{ runner.temp }}/ui-proof/*.log\n${{ runner.temp }}/ui-proof/*.patch\npackages/session-ui/component-tests/test-results/**/*.png\npackages/session-ui/component-tests/test-results/**/*.md\npackages/app/e2e/test-results/**/*.png\npackages/app/e2e/test-results/**/*.md\n${{ runner.temp }}/ui-proof/*.png",
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}