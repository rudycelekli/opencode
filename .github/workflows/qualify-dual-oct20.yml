{
  "name": "Oct21 review remaining qualification",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "case": {
          "type": "string",
          "required": false
        },
        "patch_base64": {
          "type": "string",
          "required": false
        },
        "patch_sha256": {
          "type": "string",
          "required": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "probe": {
      "if": "github.repository == 'rudycelekli/opencode'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 25,
      "env": {
        "CI": "true",
        "GITHUB_ACTIONS": "false",
        "NO_COLOR": "1",
        "PLAYWRIGHT_STORYBOOK_PORT": "6107",
        "PLAYWRIGHT_BROWSERS_PATH": "${{ github.workspace }}/.playwright-browsers",
        "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "repository": "anomalyco/opencode",
            "ref": "15adc3d91ecc6955ee0918607a5593e23bd4d538",
            "persist-credentials": false
          }
        },
        {
          "uses": "./.github/actions/setup-bun"
        },
        {
          "name": "Compare existing e2e diagnostics and complete remaining checks",
          "env": {
            "BASE": "15adc3d91ecc6955ee0918607a5593e23bd4d538",
            "CANDIDATE": "90fe85baa93dc116aadb9188eebf09bf15dfa938",
            "PATCH": "",
            "PATCH_SHA256": "f0fe3e5b04720ac165de85cb7053c630dfc0b81a309f6619aa05acf6a8dca3db",
            "EXPECTED_HASHES": "{\"packages/gui-extensions/src/review/panel.tsx\": \"55d0c766b4e852d960fdedb13bf52385c6c7079efd8d144d73fd7f16ed85aa58\", \"packages/session-ui/src/v2/components/session-review-file-preview-v2.tsx\": \"8ff4fcbfe8abe78d4e7f0669c89cc24630e6bbad6b8903adda0d8ad50c06c20d\", \"packages/app/e2e/regression/review.spec.ts\": \"0d5a3d769717506b5a0889d0d8b38d3059ef269e13d736b2f3694e43bab1012a\"}"
          },
          "run": "python - <<'PY'\nimport base64,hashlib,json,os,pathlib,re,subprocess\nroot=pathlib.Path.cwd();proof=pathlib.Path(os.environ['RUNNER_TEMP'])/'ui-proof';proof.mkdir()\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['BASE']\npatch=base64.b64decode(os.environ['PATCH'],validate=True);assert hashlib.sha256(patch).hexdigest()==os.environ['PATCH_SHA256']\np=proof/'candidate.patch';p.write_bytes(patch)\nresults=[]\ndef run(name,args,cwd=root):\n p=subprocess.run(args,cwd=cwd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=1200)\n (proof/(name+'.log')).write_text(p.stdout)\n results.append({'name':name,'exit_code':p.returncode,'command':args,'cwd':str(cwd.relative_to(root))})\n (proof/'results.json').write_text(json.dumps(results,indent=2));print(p.stdout[-25000:]);return p\nbefore=run('untouched-base-e2e-typecheck',['bun','run','typecheck:e2e'],root/'packages/app')\nassert before.returncode==1,'Unexpected baseline e2e result'\nsubprocess.run(['git','apply','--check',str(p)],check=True);subprocess.run(['git','apply',str(p)],check=True)\nhashes={f:hashlib.sha256((root/f).read_bytes()).hexdigest()for f in json.loads(os.environ['EXPECTED_HASHES'])}\nassert hashes==json.loads(os.environ['EXPECTED_HASHES'])\n(proof/'source-sha256.json').write_text(json.dumps(hashes,indent=2))\nafter=run('candidate-e2e-typecheck',['bun','run','typecheck:e2e'],root/'packages/app')\nassert after.returncode==1,'Unexpected candidate e2e result'\ndef errors(s):\n s=re.sub(r'\\x1b\\[[0-?]*[ -/]*[@-~]','',s)\n blocks=[];current=[]\n for line in s.splitlines():\n  if re.match(r'^e2e/.*\\(\\d+,\\d+\\): error TS\\d+:',line):\n   if current:blocks.append('\\n'.join(current))\n   current=[re.sub(r'\\(\\d+,\\d+\\)(?=: error TS)', '(POSITION)',line)]\n  elif current and line.startswith(' '):current.append(line)\n  elif current:\n   blocks.append('\\n'.join(current));current=[]\n if current:blocks.append('\\n'.join(current))\n return sorted(blocks)\na,b=errors(before.stdout),errors(after.stdout)\ncomparison={'count_baseline':len(a),'count_candidate':len(b),'identical_diagnostics_ignoring_source_positions':a==b,'baseline':a,'candidate':b,'optional_check_passes':False}\n(proof/'e2e-comparison.json').write_text(json.dumps(comparison,indent=2))\nassert len(a)==len(b)==9 and a==b,'Changed or unexpected e2e diagnostics: investigate'\nassert run('changed-lint',['bun','run','lint:changed',os.environ['BASE']]).returncode==0\nassert run('root-check',['bun','run','check']).returncode==0\nassert subprocess.check_output(['git','diff','--binary','--full-index','--',*hashes])==patch\nassert {f:hashlib.sha256((root/f).read_bytes()).hexdigest()for f in hashes}==hashes\nsubprocess.run(['git','diff','--check'],check=True)\n(proof/'input.json').write_text(json.dumps({'base':os.environ['BASE'],'candidate':os.environ['CANDIDATE'],'patch_sha256':os.environ['PATCH_SHA256'],'prior_browser_and_owning_checks':'39547232825','optional_e2e_typecheck':'FAILS on untouched base and exact candidate with same nine diagnostics; no unrelated repairs'},indent=2))\n\nPY"
        },
        {
          "name": "Preserve diagnostic evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "ui-wave2-${{ github.run_id }}",
            "path": "${{ runner.temp }}/ui-proof/*.json\n${{ runner.temp }}/ui-proof/*.log\n${{ runner.temp }}/ui-proof/*.patch\npackages/session-ui/component-tests/test-results/**/*.png\npackages/session-ui/component-tests/test-results/**/*.md",
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}