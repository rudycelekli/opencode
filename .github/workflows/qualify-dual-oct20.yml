{
  "name": "Oct21 desktop review mention qualification",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "case": {
          "type": "string",
          "required": false
        },
        "patch_base64": {
          "type": "string",
          "required": false
        },
        "patch_sha256": {
          "type": "string",
          "required": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "probe": {
      "if": "github.repository == 'rudycelekli/opencode'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 50,
      "env": {
        "CI": "true",
        "GITHUB_ACTIONS": "false",
        "NO_COLOR": "1",
        "PLAYWRIGHT_STORYBOOK_PORT": "6107",
        "PLAYWRIGHT_BROWSERS_PATH": "${{ github.workspace }}/.playwright-browsers",
        "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "repository": "anomalyco/opencode",
            "ref": "15adc3d91ecc6955ee0918607a5593e23bd4d538",
            "persist-credentials": false
          }
        },
        {
          "uses": "./.github/actions/setup-bun"
        },
        {
          "name": "Pin browser installer Node to upstream documented compatible version",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.15"
          }
        },
        {
          "name": "Install Chromium with system dependencies",
          "working-directory": "packages/app",
          "run": "bunx playwright install --with-deps chromium"
        },
        {
          "name": "Verify actual desktop review file suggestions and owning checks",
          "env": {
            "BASE": "15adc3d91ecc6955ee0918607a5593e23bd4d538",
            "FIXTURE_PATCH": "",
            "FIX_PATCH": "",
            "FIXTURE_SHA256": "0676f62cf152fdaf64f793f1cd77d79953ac6b1a77b7e54794360312bcb557a5",
            "FIX_SHA256": "cfd2de4749d1c87dcbc2b011760c14366be80e63eb02b2592218e9546283f22f"
          },
          "run": "python - <<'PY'\nimport base64,hashlib,json,os,pathlib,re,subprocess\nroot=pathlib.Path.cwd();proof=pathlib.Path(os.environ['RUNNER_TEMP'])/'ui-proof';proof.mkdir()\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['BASE']\npatches={}\nfor kind in ['FIXTURE','FIX']:\n data=base64.b64decode(os.environ[kind+'_PATCH'],validate=True)\n assert hashlib.sha256(data).hexdigest()==os.environ[kind+'_SHA256']\n p=proof/(kind.lower()+'.patch');p.write_bytes(data);patches[kind]=p\nsubprocess.run(['git','apply','--check',str(patches['FIXTURE'])],check=True)\nsubprocess.run(['git','apply',str(patches['FIXTURE'])],check=True)\ntest=root/'packages/app/e2e/regression/review.spec.ts'\ntest_hash=hashlib.sha256(test.read_bytes()).hexdigest()\nresults=[]\ndef run(name,args,cwd=root):\n p=subprocess.run(args,cwd=cwd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=1500)\n (proof/(name+'.log')).write_text(p.stdout)\n results.append({'name':name,'exit_code':p.returncode,'command':args,'cwd':str(cwd.relative_to(root))})\n (proof/'results.json').write_text(json.dumps(results,indent=2));print(p.stdout[-20000:])\n return p\ncommand=['bun','run','test:e2e','--','e2e/regression/review.spec.ts','--grep','desktop review comments suggest workspace file mentions','--project=chromium','--workers=2','--retries=0','--reporter=line']\np=run('baseline-browser',command,root/'packages/app')\nplain=re.sub(r'\\x1b\\[[0-?]*[ -/]*[@-~]','',p.stdout)\noracle=p.returncode==1 and '1 failed' in plain and 'line-comment-v2-mention-item' in plain and 'README.md' in plain and 'Cannot find module' not in plain\n(proof/'baseline-oracle.json').write_text(json.dumps({'passed':oracle,'expected':'actual desktop editor opens and types query, missing expected README suggestion'},indent=2))\nassert oracle,'No qualifying browser failure; preserve evidence and diagnose'\nsubprocess.run(['git','apply','--check',str(patches['FIX'])],check=True)\nsubprocess.run(['git','apply',str(patches['FIX'])],check=True)\nfiles=['packages/gui-extensions/src/review/panel.tsx','packages/session-ui/src/v2/components/session-review-file-preview-v2.tsx']\nassert subprocess.check_output(['git','diff','--binary','--full-index','--',*files])==patches['FIX'].read_bytes()\nassert run('candidate-browser',command+['--repeat-each=10'],root/'packages/app').returncode==0\nassert run('review-keeper',['bun','run','test:e2e','--','e2e/regression/review.spec.ts','--project=chromium','--workers=2','--retries=0','--reporter=line'],root/'packages/app').returncode==0\nfor package in ['gui-extensions','session-ui','app']:\n assert run(package+'-tests',['bun','run','test'],root/'packages'/package).returncode==0\n assert run(package+'-typecheck',['bun','typecheck'],root/'packages'/package).returncode==0\nassert run('e2e-typecheck',['bun','run','typecheck:e2e'],root/'packages/app').returncode==0\nassert run('changed-lint',['bun','run','lint:changed',os.environ['BASE']]).returncode==0\nassert run('root-check',['bun','run','check']).returncode==0\nassert hashlib.sha256(test.read_bytes()).hexdigest()==test_hash\nassert subprocess.check_output(['git','diff','--binary','--full-index','--',*files])==patches['FIX'].read_bytes()\nhashes={f:hashlib.sha256((root/f).read_bytes()).hexdigest() for f in files+[str(test.relative_to(root))]}\n(proof/'source-sha256.json').write_text(json.dumps(hashes,indent=2))\n(proof/'input.json').write_text(json.dumps({'base':os.environ['BASE'],'fixture_sha256':os.environ['FIXTURE_SHA256'],'fix_sha256':os.environ['FIX_SHA256']},indent=2))\nsubprocess.run(['git','diff','--check'],check=True)\n\nPY"
        },
        {
          "name": "Preserve diagnostic evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "ui-wave2-${{ github.run_id }}",
            "path": "${{ runner.temp }}/ui-proof/*.json\n${{ runner.temp }}/ui-proof/*.log\n${{ runner.temp }}/ui-proof/*.patch\npackages/session-ui/component-tests/test-results/**/*.png\npackages/session-ui/component-tests/test-results/**/*.md\npackages/app/e2e/test-results/**/*.png\npackages/app/e2e/test-results/**/*.md",
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}