{
  "name": "Oct20 UI diagnostic probes",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "case": {
          "type": "string",
          "required": false
        },
        "patch_base64": {
          "type": "string",
          "required": false
        },
        "patch_sha256": {
          "type": "string",
          "required": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "probe": {
      "if": "github.repository == 'rudycelekli/opencode'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 35,
      "env": {
        "CI": "true",
        "GITHUB_ACTIONS": "false",
        "NO_COLOR": "1",
        "PLAYWRIGHT_STORYBOOK_PORT": "6107",
        "PLAYWRIGHT_BROWSERS_PATH": "${{ github.workspace }}/.playwright-browsers",
        "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "repository": "anomalyco/opencode",
            "ref": "c600cddc68f1c5488448d6410b1b248489bc00f8",
            "persist-credentials": false
          }
        },
        {
          "uses": "./.github/actions/setup-bun"
        },
        {
          "name": "Pin browser installer Node to upstream documented compatible version",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.15"
          }
        },
        {
          "name": "Install Chromium with system dependencies",
          "working-directory": "packages/app",
          "run": "bunx playwright install --with-deps chromium"
        },
        {
          "name": "Run real component diagnostic probes",
          "env": {
            "BASE": "c600cddc68f1c5488448d6410b1b248489bc00f8",
            "PROBE_PATCH": "",
            "PATCH_SHA256": "c7bbf9281857c6e4601b08de133952bc657a493c6c4d8f042f5d9c5448cb7f33"
          },
          "run": "python - <<'PY'\nimport base64,hashlib,json,os,pathlib,subprocess,sys\nroot=pathlib.Path.cwd();proof=pathlib.Path(os.environ['RUNNER_TEMP'])/'ui-proof';proof.mkdir()\npatch=base64.b64decode(os.environ['PROBE_PATCH'],validate=True)\nassert hashlib.sha256(patch).hexdigest()==os.environ['PATCH_SHA256']\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['BASE']\np=proof/'tests.patch';p.write_bytes(patch)\nsubprocess.run(['git','apply','--check',str(p)],check=True)\nsubprocess.run(['git','apply',str(p)],check=True)\ntest=root/'packages/session-ui/component-tests/probe-markdown.spec.ts'\n(proof/'input.json').write_text(json.dumps({'base':os.environ['BASE'],'patch_sha256':hashlib.sha256(patch).hexdigest(),'test_sha256':hashlib.sha256(test.read_bytes()).hexdigest(),'purpose':'diagnostic only; no production fix or qualification claim'},indent=2))\ncommand=['bun','run','test:components','--','component-tests/probe-markdown.spec.ts','--workers=2','--retries=0']\nresult=subprocess.run(command,cwd=root/'packages/session-ui',stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=1200)\n(proof/'baseline.log').write_text(result.stdout)\n(proof/'results.json').write_text(json.dumps({'command':command,'exit_code':result.returncode,'base':os.environ['BASE']},indent=2))\nprint(result.stdout[-25000:])\nassert hashlib.sha256(test.read_bytes()).hexdigest()==json.loads((proof/'input.json').read_text())['test_sha256']\nsys.exit(result.returncode)\n\nPY"
        },
        {
          "name": "Preserve diagnostic evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "ui-wave2-${{ github.run_id }}",
            "path": "${{ runner.temp }}/ui-proof/*.json\n${{ runner.temp }}/ui-proof/*.log\n${{ runner.temp }}/ui-proof/*.patch\npackages/session-ui/component-tests/test-results/**/*.png\npackages/session-ui/component-tests/test-results/**/*.md",
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}