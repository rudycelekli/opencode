{
  "name": "Oct21 documented form types qualification",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "case": {
          "type": "string",
          "required": false
        },
        "patch_base64": {
          "type": "string",
          "required": false
        },
        "patch_sha256": {
          "type": "string",
          "required": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "probe": {
      "if": "github.repository == 'rudycelekli/opencode'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 35,
      "env": {
        "CI": "true",
        "GITHUB_ACTIONS": "false",
        "NO_COLOR": "1",
        "PLAYWRIGHT_STORYBOOK_PORT": "6107",
        "PLAYWRIGHT_BROWSERS_PATH": "${{ github.workspace }}/.playwright-browsers",
        "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24": "true"
      },
      "steps": [
        {
          "uses": "actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5",
          "with": {
            "repository": "anomalyco/opencode",
            "ref": "15adc3d91ecc6955ee0918607a5593e23bd4d538",
            "persist-credentials": false
          }
        },
        {
          "uses": "./.github/actions/setup-bun"
        },
        {
          "name": "Compile the documented form handler against actual SDK exports",
          "env": {
            "BASE": "15adc3d91ecc6955ee0918607a5593e23bd4d538",
            "DOC_PATCH": "",
            "PATCH_SHA256": "12422a8cca7132e1909e0ba36d2fa31bf2f752fbfa3309bfe2658e1671bd20ca"
          },
          "run": "python - <<'PY'\nimport base64,hashlib,json,os,pathlib,re,subprocess\nroot=pathlib.Path.cwd();proof=pathlib.Path(os.environ['RUNNER_TEMP'])/'ui-proof';proof.mkdir()\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['BASE']\npatch=base64.b64decode(os.environ['DOC_PATCH'],validate=True)\nassert hashlib.sha256(patch).hexdigest()==os.environ['PATCH_SHA256']\n(proof/'candidate.patch').write_bytes(patch)\ndoc=root/'services/www/src/docs/content/build/plugins/cli.mdx'\nfixture=root/'packages/plugin/src/tui/doc-form-proof.ts'\nconfig=root/'packages/plugin/tsconfig.doc-proof.json'\nresults=[]\ndef run(name,args,cwd=root):\n p=subprocess.run(args,cwd=cwd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=1200)\n (proof/(name+'.log')).write_text(p.stdout)\n results.append({'name':name,'exit_code':p.returncode,'command':args})\n (proof/'results.json').write_text(json.dumps(results,indent=2));print(p.stdout[-18000:]);return p\ndef compile_example(name):\n examples=re.findall(r'```ts\\n([\\s\\S]*?)\\n```',doc.read_text())\n example=next(s for s in examples if re.search(r'import type \\{ (?:Session)?FormCancelInput,',s))\n source='import type { Context } from \"./context.js\"\\ndeclare const context: Context\\ndeclare const sessionID: string\\n'+example+'\\n'\n fixture.write_text(source);(proof/(name+'-example.ts')).write_text(source)\n config.write_text(json.dumps({'extends':'./tsconfig.json','compilerOptions':{'noUnusedLocals':False},'include':['src/tui/doc-form-proof.ts']}))\n p=run(name,['bunx','tsc','--noEmit','-p','tsconfig.doc-proof.json'],root/'packages/plugin')\n fixture.unlink();config.unlink();return p\np=compile_example('baseline-example')\nassert p.returncode!=0 and p.stdout.count('TS2305')==2 and 'FormCancelInput' in p.stdout and 'FormReplyInput' in p.stdout\nassert len(re.findall(r'error TS\\d+',p.stdout))==2,'Unexpected baseline compiler diagnostic'\nassert run('baseline-plugin-typecheck',['bun','typecheck'],root/'packages/plugin').returncode==0\nfor name,args in [('typecheck',['bun','typecheck']),('generated',['bun','run','check:generated']),('build',['bun','run','build'])]:\n assert run('baseline-www-'+name,args,root/'services/www').returncode==0\nsubprocess.run(['git','apply','--check',str(proof/'candidate.patch')],check=True)\nsubprocess.run(['git','apply',str(proof/'candidate.patch')],check=True)\nassert compile_example('candidate-example').returncode==0\nassert run('candidate-plugin-typecheck',['bun','typecheck'],root/'packages/plugin').returncode==0\nfor name,args in [('typecheck',['bun','typecheck']),('generated',['bun','run','check:generated']),('build',['bun','run','build'])]:\n assert run('candidate-www-'+name,args,root/'services/www').returncode==0\nassert run('root-check',['bun','run','check']).returncode==0\npath=str(doc.relative_to(root))\nassert subprocess.check_output(['git','diff','--binary','--full-index','--',path])==patch\n(proof/'source-sha256.json').write_text(json.dumps({path:hashlib.sha256(doc.read_bytes()).hexdigest()},indent=2))\n(proof/'input.json').write_text(json.dumps({'base':os.environ['BASE'],'patch_sha256':hashlib.sha256(patch).hexdigest()},indent=2))\nsubprocess.run(['git','diff','--check'],check=True)\n\nPY"
        },
        {
          "name": "Preserve diagnostic evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "ui-wave2-${{ github.run_id }}",
            "path": "${{ runner.temp }}/ui-proof/*.json\n${{ runner.temp }}/ui-proof/*.log\n${{ runner.temp }}/ui-proof/*.patch\npackages/session-ui/component-tests/test-results/**/*.png\npackages/session-ui/component-tests/test-results/**/*.md\n${{ runner.temp }}/ui-proof/*.ts",
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}